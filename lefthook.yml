# Lefthook — Git hooks configuration
# Install hooks: npx lefthook install

pre-commit:
  parallel: true
  commands:
    # Enforce that all Tauri invoke() calls go through src/lib/api.ts.
    # Direct imports of @tauri-apps/api/core in other files are a bug —
    # they bypass type wrappers and break the single source-of-truth contract.
    no-invoke-outside-api:
      run: |
        violations=$(grep -rn "from '@tauri-apps/api/core'" src/ --include='*.ts' --include='*.tsx' | grep -v 'src/lib/api.ts' || true)
        if [ -n "$violations" ]; then
          echo "ERROR: Direct @tauri-apps/api/core import found outside src/lib/api.ts:"
          echo "$violations"
          echo "Use the typed wrappers in src/lib/api.ts instead of calling invoke() directly."
          exit 1
        fi
    # Strict JSX-literal guard. Every user-visible string must come from
    # `t()` — see `src/locales/` and `src/i18n/`. The script reports zero
    # violations after the Phase 2 component sweep. Add `// i18n-ignore`
    # to a line to opt out (debug UI, intentional English).
    no-jsx-literals:
      glob: "src/**/*.{ts,tsx}"
      run: node scripts/check-jsx-literals.mjs
    biome-check:
      glob: "src/**/*.{ts,tsx}"
      run: npx biome check --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    # Documentation guards. All four are pure file reads — ~0.1 s each, no
    # build — so they belong at commit time rather than in a release check
    # nobody reaches until the tag is being cut. Each is globbed to the files
    # it actually depends on, so a Rust-only commit pays nothing. The doc↔model
    # catalog contract tests are deliberately NOT here: they need cargo, and
    # pre-push already runs the Rust suite.
    docs-parity:
      glob: "docs/site/**/*.md"
      run: bash scripts/check-docs-parity.sh
    # Both sides of the contract: the page quoting a label, and the label itself.
    docs-labels:
      glob: "{docs/site/**/*.md,src/locales/**/*.json}"
      run: bash scripts/check-docs-labels.sh
    docs-paths:
      glob: "**/*.md"
      run: uv run --no-project scripts/check-docs-paths.py
    # Every block of the docs must be a catalogued claim, in all four languages.
    docs-claims:
      glob: "{docs/site/**/*.md,docs/site/claims.toml,.claude/skills/verify-emailops/scripts/doc_claims*.mjs,scripts/docs_cli_claims.py}"
      run: uv run --no-project scripts/check-docs-claims.py
    docs-scripts-tests:
      glob: "scripts/{docs_*,check_docs*,check-docs*}.py"
      run: uv run --no-project --with pytest pytest -q scripts/tests
    # typecheck, clippy and rustfmt-check run single gates from
    # scripts/gates.sh, which owns the exact CI flags and the Node version
    # (.nvmrc); `make gates` runs the same commands by hand.
    typecheck:
      glob: "src/**/*.{ts,tsx}"
      run: bash scripts/gates.sh tsc
    clippy:
      glob: "src-tauri/src/**/*.rs"
      run: bash scripts/gates.sh clippy
    rustfmt-check:
      glob: "src-tauri/src/**/*.rs"
      run: bash scripts/gates.sh fmt
    # Scan staged files for committed secrets. Requires gitleaks to be
    # installed locally: `brew install gitleaks`. The hook is a no-op if
    # the binary isn't present so contributors aren't blocked by setup.
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --verbose
        else
          echo "warning: gitleaks not installed — skipping secret scan. Run 'brew install gitleaks'."
        fi

# New worktrees get their src-tauri/target linked to /Volumes/Build (when the
# machine has that volume) before the first build — see scripts/build_target.sh.
post-checkout:
  commands:
    build-target:
      run: bash scripts/build_target.sh link

pre-push:
  parallel: true
  commands:
    # cargo test, clippy with and without `--features desktop` and
    # cargo-outdated: the `push` set of scripts/gates.sh, which owns the exact
    # CI flags. A missing cargo-outdated warns instead of blocking the push.
    rust-gates:
      run: GATES_OPTIONAL=outdated bash scripts/gates.sh push
    secrets-check:
      run: "! git diff origin/main...HEAD -- ':(exclude)*.example' ':(exclude)*.md' 2>/dev/null | grep -E '^\\+.*(sk-or-v1-[a-f0-9]{20}|GOCSPX-[A-Za-z0-9]{20})' || (echo 'ERROR: Potential secrets detected in diff' && exit 1)"
    # Catch package.json / package-lock.json drift before it breaks CI.
    # CI (.github/workflows/ci.yml) and the release workflow both call
    # `npm ci`, which refuses to install when the two files are out of
    # sync. This bit us once when a new dep was added to package.json
    # without regenerating the lockfile — the failure only surfaced on
    # the macOS runner mid-release. `npm ci --dry-run` reproduces that
    # exact check locally in ~1s with a warm npm cache.
    # Runs on a copy of the manifests: npm 9's `npm ci` empties node_modules
    # before it honours --dry-run, so checking in place wiped the checkout's
    # node_modules on every push.
    npm-lockfile-sync:
      run: |
        tmp=$(mktemp -d)
        cp package.json package-lock.json "$tmp"/
        if ! (cd "$tmp" && npm ci --dry-run >/dev/null 2>&1); then
          echo "ERROR: package.json and package-lock.json are out of sync."
          echo "Run 'npm install --package-lock-only' and commit the updated lockfile."
          echo ""
          echo "Full npm ci output:"
          (cd "$tmp" && npm ci --dry-run 2>&1 | head -40)
          rm -rf "$tmp"
          exit 1
        fi
        rm -rf "$tmp"
