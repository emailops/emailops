# Every claim the published docs make, and how it is verified.
#
# Each paragraph, list item, table and code block in docs/site/en/*.md carries a
# `<!-- claim:<id> -->` marker; each id has an entry here. check-docs-claims.py
# fails if any block is unmarked, if a marker has no entry, or if the four
# languages disagree — so "the docs are fully verified" is a checked fact, not a
# hope. `make docs-check` runs the checks and renders the report.
#
# A claim has one or more checks, and passes only if all of them do:
#
#   { file = "path or glob", quoted = "text" }
#       `text` must appear in the claim itself AND in the file. This is what ties
#       prose to code: if either side changes, the check fails. Case-insensitive
#       on the file side; whitespace in the claim is collapsed first.
#       A locale file proves a LABEL exists, never that a FEATURE does — the
#       app's own help text can be as stale as the docs. Evidence for a feature
#       is code: src/lib/api.ts is the one path from the UI to the backend.
#   { file = "...", has = "text" }     the file contains text (evidence the doc
#                                       does not quote verbatim)
#   { file = "...", lacks = "text" }   the file does not contain text
#   { tests = ["rust::path::to::test", ...] }   existing tests that prove the
#                                       behaviour; each must exist and pass
#   { app = true }                     a docClaim('<id>') in sweep.mjs drives the
#                                       real UI (make docs-check ARGS=--with-app)
#   { manual = "why" }                 cannot be proven automatically. Reported as
#                                       MANUAL, never as OK.
#   { none = "why" }                   the block makes no claim of its own (a
#                                       lead-in to a list). Reported as N/A.
#
# `fix` is what the report proposes when the claim fails.

