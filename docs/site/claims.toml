# Every claim the published docs make, and how it is verified.
#
# Each paragraph, list item, table and code block in docs/site/en/*.md carries a
# `<!-- claim:<id> -->` marker; each id has an entry here. check-docs-claims.py
# fails if any block is unmarked, if a marker has no entry, or if the four
# languages disagree — so "the docs are fully verified" is a checked fact, not a
# hope. `make docs-check ARGS=--with-app` runs everything and renders the report.
#
# THE APP IS THE GROUND TRUTH. Prefer, in this order:
#
#   { app = true }        the running app shows it. claim('<id>', …) cases in
#                         doc_claims.mjs (fresh install, locked relaunch),
#                         doc_claims_demo.mjs (demo mailbox) or
#                         scripts/docs_cli_claims.py (the CLI) read the expected
#                         value from the claim's own text and check the app;
#                         each case quotes the sentences it proves (`covers`).
#   { generated = "test" } a reference table rewritten from code between
#                         <!-- generated:name --> markers (make docs-gen); the
#                         test fails when the markdown and the code disagree.
#   { release = "asset" } "download X from the latest release": the asset is on
#                         the latest published GitHub release, and the claim
#                         names it.
#   { tests = [...] }     behaviour the demo cannot drive (a real Gmail server,
#                         the keychain, an Intel Mac): the tests that prove it
#                         must exist and pass.
#   { file = …, quoted | has | lacks = … }
#                         ONLY where the file is the thing itself — the cask is
#                         what `brew --zap` removes, tauri.conf.json gates the
#                         macOS version, release.yml is the pipeline. Text that
#                         merely appears in the code proves nothing: a locale
#                         string can exist and never be rendered.
#   { judge = "question", evidence = ["file:…"], visual = true }
#                         the agent judges it against the evidence (maintain-docs
#                         step 2); shown as [AGT], apart from deterministic checks.
#   { manual = "why" }    nothing automatic proves it: yellow, with the reason.
#   { none = "why" }      a lead-in that makes no claim of its own.
#
# Any check may take `covers = ["…"]`: the sentences it proves, quoted as the
# reader sees them. A passing check without `covers` does not make its block
# green (it cannot vouch for sentences it never names) — except `quoted` and
# `release`, which cover the sentence they quote, and `generated`, which covers
# the table rows. `manual` and `none` without `covers` apply to the whole block.
# `how` overrides the report's description of how a check validates.
#
# `fix` is what the report proposes when the claim fails.

