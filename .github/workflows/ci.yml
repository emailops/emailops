name: CI

# Note on `--no-default-features`
# --------------------------------
# The Ubuntu Rust jobs pass `--no-default-features` to skip the embedded
# `llama-cpp-2` build (CMake + a full C++ toolchain link, several minutes
# of cold-cache CI time and a multi-GB target dir). This matches the
# `*-fast` Makefile targets used during local iteration.
#
# The `build-macos` job compensates: it runs `cargo test` with default
# features (llamacpp enabled) before producing the .app bundle.  Any code
# gated behind `#[cfg(feature = "llamacpp")]` is therefore compiled and
# tested on every PR — just on macOS rather than Linux.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-frontend:
    name: Lint & Typecheck (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx biome check src/
      - run: npx tsc --noEmit
      - run: npm run test:frontend

  lint-backend:
    name: Lint & Check (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # tauri-build validates bundle.resources at cargo-check time. The bundled
      # Nomic GGUF is gitignored (fetched on demand by `make fetch-bundled-models`).
      # On Linux CI we only compile, never bundle, so a zero-byte placeholder is
      # enough to satisfy the resource check without downloading 80 MB.
      - name: Placeholder bundled model (skip download on Linux CI)
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/nomic-embed-text-v1.5-q4_k_m.gguf

      - name: Clippy
        # `--tests` covers test code too, so unwrap/expect rules and
        # other lints don't silently regress in test files.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --tests -- -D warnings

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # See lint-backend job for rationale.
      - name: Placeholder bundled model (skip download on Linux CI)
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/nomic-embed-text-v1.5-q4_k_m.gguf

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # We invoke the gitleaks CLI directly (Apache-2.0, free) instead of the
      # `gitleaks/gitleaks-action@v2` wrapper, which requires a paid license
      # for organisation accounts. Same scanner, no licence gate.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # `detect` scans the full git history reachable from HEAD; `--redact`
        # masks any matches in the log so secrets don't end up in the run
        # output. Non-zero exit on any finding fails the job.
        run: gitleaks detect --source=. --redact --verbose --exit-code 1

  # ── Build jobs temporarily disabled ─────────────────────────────────────────
  # Both `build` (Ubuntu Vite bundle) and `build-macos` (full Tauri bundle +
  # llamacpp tests + .app artifact) are commented out for now to save CI
  # minutes — the project ships mac-only and a signed bundle is produced by
  # the separate release workflow, so the bundle check on every PR is
  # currently overkill. Lint + tests + security still run on every PR.
  #
  # To re-enable, uncomment the blocks below. `build-macos` is the one that
  # matters for regression coverage — it exercises the C++/CMake / llamacpp
  # path that `--no-default-features` on Linux skips. `build` (Ubuntu) is
  # redundant once `build-macos` is back, because `tauri build` runs
  # `npm run build` as `beforeBuildCommand` (tauri.conf.json:9).
