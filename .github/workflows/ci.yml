name: CI

# Platform coverage
# -----------------
# The app ships on macOS, Linux and Windows, but development happens on macOS
# and there is no cross-toolchain there — so nothing in a local `make check`
# can compile the Linux or Windows code paths. CI is therefore the ONLY gate
# that verifies them, and `test-windows` in particular is what catches the
# `std::os::unix` / `libc::flock` class of bug that used to make the crate
# uncompilable on Windows outright.
#
# Note on `--no-default-features`
# --------------------------------
# The fast Rust jobs pass `--no-default-features` to skip the embedded
# `llama-cpp-2` build (CMake + a full C++ toolchain link, several minutes of
# cold-cache CI time and a multi-GB target dir). This matches the `*-fast`
# Makefile targets used during local iteration.
#
# `compile-llamacpp` compensates: it compiles WITH default features on both
# Ubuntu and Windows, so code gated behind `#[cfg(feature = "llamacpp")]` and
# the CMake/C++ toolchain are exercised. It is slow, so it runs on pushes to
# main rather than on every PR.

on:
  push:
    branches: [main]
  pull_request:
  # Lets the slow `compile-llamacpp` sweep be run on demand from the Actions UI
  # against any branch, without paying for it on every pull request.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-frontend:
    name: Lint & Typecheck (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx biome check src/
      - run: npx tsc --noEmit
      - run: npm run test:frontend

  lint-backend:
    name: Lint & Check (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # tauri-build validates bundle.resources at cargo-check time. The bundled
      # Nomic GGUF is gitignored (fetched on demand by `make fetch-bundled-models`).
      # On Linux CI we only compile, never bundle, so a zero-byte placeholder is
      # enough to satisfy the resource check without downloading 80 MB.
      - name: Placeholder bundled model (skip download on Linux CI)
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/nomic-embed-text-v1.5-q4_k_m.gguf

      - name: Clippy
        # `--tests` covers test code too, so unwrap/expect rules and
        # other lints don't silently regress in test files.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --tests -- -D warnings

      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # See lint-backend job for rationale.
      - name: Placeholder bundled model (skip download on Linux CI)
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/nomic-embed-text-v1.5-q4_k_m.gguf

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

  # The highest-value job in this file. Everything else runs on a Unix host,
  # where `std::os::unix` imports and unix-only crate APIs compile fine — this
  # is the only place a Windows-breaking change is caught before a user hits it.
  test-windows:
    name: Lint & Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-msvc

      # tauri-build validates bundle.resources at cargo-check time; the real
      # GGUF is gitignored and only needed when actually bundling.
      - name: Placeholder bundled model
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/nomic-embed-text-v1.5-q4_k_m.gguf

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --tests -- -D warnings

      # TEMPORARY DIAGNOSTIC — remove once the load failure below is understood.
      # The lib test binary dies with STATUS_ENTRYPOINT_NOTFOUND (0xc0000139)
      # before running a single test, while the app binary built by the bundle
      # job links and runs fine. That exit code means a DLL *was* found but did
      # not export something the binary imports, so the question is which DLL
      # resolves differently for the test exe than for the app exe.
      - name: Set up MSVC dev tools (for dumpbin)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Diagnose test-binary DLL imports
        continue-on-error: true
        shell: pwsh
        run: |
          $json = cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --no-run --message-format=json 2>$null
          $exes = $json | ForEach-Object {
            try { $o = $_ | ConvertFrom-Json } catch { return }
            if ($o.reason -eq 'compiler-artifact' -and $o.executable) { $o.executable }
          }
          foreach ($exe in $exes) {
            Write-Host "=== DEPENDENTS: $exe ==="
            dumpbin /DEPENDENTS "$exe"
          }
          Write-Host "=== DLLs sitting next to the test binaries ==="
          Get-ChildItem -Recurse -Filter *.dll src-tauri/target/debug |
            Select-Object -First 60 FullName, Length, LastWriteTime | Format-Table -AutoSize
          Write-Host "=== Attempt to launch the lib test exe ==="
          foreach ($exe in $exes) {
            $p = Start-Process -FilePath $exe -ArgumentList '--list' -NoNewWindow -Wait -PassThru `
                   -RedirectStandardOutput out.txt -RedirectStandardError err.txt
            Write-Host "$exe -> exit 0x$('{0:X}' -f $p.ExitCode)"
            Get-Content err.txt -ErrorAction SilentlyContinue | Select-Object -First 20
          }

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

  # Compiles the embedded llama.cpp path (CMake + C++) on both Linux and
  # Windows. Slow and cache-sensitive, so it is limited to pushes to main;
  # a PR that only touches Rust is covered by the fast jobs above.
  compile-llamacpp:
    name: Compile with llamacpp (${{ matrix.os }})
    # Skipped on pull requests only — a cold llama.cpp build is ~30-60 min per
    # OS. Runs on pushes to main, and on demand via workflow_dispatch when you
    # want to check the C++ path on a branch before merging.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: llamacpp-${{ matrix.os }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev cmake

      # MSVC and CMake are preinstalled on windows-latest; this only asserts it.
      - name: Verify toolchain (Windows)
        if: runner.os == 'Windows'
        run: cmake --version

      - name: Placeholder bundled model
        shell: bash
        run: |
          mkdir -p src-tauri/resources/models
          touch src-tauri/resources/models/nomic-embed-text-v1.5-q4_k_m.gguf

      # `cargo check` still runs llama-cpp-sys-2's build script, so the CMake /
      # C++ compile is genuinely exercised; only the final Rust codegen and
      # link are skipped. That is the expensive part we can afford to omit.
      - name: Check with default features (llamacpp)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  # Validates the per-platform bundle configuration (tauri.linux.conf.json /
  # tauri.windows.conf.json) and the packaging step itself. Built WITHOUT
  # llamacpp so it stays fast enough for every PR — `compile-llamacpp` covers
  # the C++ side separately. Nothing here is code-signed.
  bundle:
    name: Bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [lint-frontend, test]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle-${{ matrix.platform }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: npm ci

      # Invoke the same Makefile targets developers run locally, so CI and
      # local builds cannot drift apart. They require a POSIX shell, which is
      # why the Windows leg runs under bash (Git Bash ships on the runner).
      - name: Build bundle
        shell: bash
        env:
          NO_DEFAULT_FEATURES: "1"
        run: make build-${{ matrix.platform }}

      - name: Verify bundle
        shell: bash
        run: make verify-${{ matrix.platform }}

      - name: Stage artifacts
        shell: bash
        run: make dist-${{ matrix.platform }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: emailops-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # We invoke the gitleaks CLI directly (Apache-2.0, free) instead of the
      # `gitleaks/gitleaks-action@v2` wrapper, which requires a paid license
      # for organisation accounts. Same scanner, no licence gate.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        # `detect` scans the full git history reachable from HEAD; `--redact`
        # masks any matches in the log so secrets don't end up in the run
        # output. Non-zero exit on any finding fails the job.
        run: gitleaks detect --source=. --redact --verbose --exit-code 1

  # ── macOS bundle job still disabled ─────────────────────────────────────────
  # The Linux and Windows bundle legs now live in the `bundle` job above; the
  # standalone Ubuntu Vite-only `build` job it replaced has been removed as
  # redundant (`tauri build` runs `npm run build` as its beforeBuildCommand,
  # tauri.conf.json:9).
  #
  # `build-macos` remains commented out to save CI minutes: the signed mac
  # bundle is produced by the separate release workflow, and the llamacpp /
  # CMake path it used to be the sole guardian of is now covered on Linux and
  # Windows by `compile-llamacpp`. Re-enable it if macOS-specific bundling
  # (icon pipeline, codesign placeholders, universal build) starts regressing.
  # ────────────────────────────────────────────────────────────────────────────
  #
  # # macOS bundle job — catches regressions in the Tauri bundle step that
  # # the Ubuntu build job cannot (icon pipeline, codesign placeholders,
  # # llama.cpp universal build, etc.). The .dmg artifact is NOT signed or
  # # notarized here; that happens in the separate release workflow.
