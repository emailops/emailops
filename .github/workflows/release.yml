name: Release

# Linux + Windows (Vulkan) + Windows (CUDA). macOS is deliberately NOT built here — it's signed and
# notarized locally via `make build-mac` and uploaded by hand (the `release`
# skill drives that flow end to end), and that's a permanent choice, not a
# stopgap: keeping macOS out of this workflow means the signing/notarization
# secrets never need to touch a job whose only job is producing unsigned
# Linux/Windows installers. `workflow_dispatch` takes an explicit `tag_name`
# so it can be triggered from any ref (e.g. `main` right after pushing a tag)
# and still reliably attach its artifacts to that tag's release — including a
# release the `release` skill already created for the macOS DMG.
#
# Set `dry_run: true` to build/verify/smoke-test without touching the public
# releases page at all — the installers land as a downloadable workflow
# artifact instead. Use this to validate a change to this workflow or the
# build scripts before it's ever tied to a real release tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Ref to build: a release tag (e.g. v0.6.5) for a real release, or any branch/tag when dry_run is checked."
        required: true
        type: string
      dry_run:
        description: "Build, verify, and smoke-test only — never create/update the GitHub Release. Artifacts are uploaded as a workflow artifact instead so they can still be inspected."
        required: false
        type: boolean
        default: false
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Deliberately one job with a platform matrix, not split per-OS: unlike the
  # macOS build there's no certificate import/notarization/keychain teardown
  # that would need special-casing per leg, so a matrix is the right amount
  # of shared structure.
  #
  # NOT code-signed. Linux packages conventionally are not; Windows installers
  # would need an OV/EV certificate the project does not hold, so users see a
  # SmartScreen warning on first run. Adding one means a `signtool` step in
  # scripts/build_platform.sh plus the cert in repository secrets.
  #
  # Asset names match `scripts/dist_platform.sh`, which mirrors `dist-mac`'s
  # convention so every platform has a permanent latest-download URL:
  #   .../releases/latest/download/EmailOps-linux.AppImage
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to 22.04, NOT ubuntu-latest. glibc is only backward
          # compatible: a binary built against glibc 2.35 runs on 2.39, but not
          # the reverse — so the runner image sets the *minimum* glibc a user
          # needs, and `ubuntu-latest` silently raises that floor whenever
          # GitHub rolls the image. It rolled to 24.04 (glibc 2.39), which made
          # the .deb and .AppImage refuse to start on Ubuntu 22.04 with
          # "version `GLIBC_2.38' not found" — a release regression with no
          # accompanying code change. 22.04 is the oldest LTS that still ships
          # libwebkit2gtk-4.1 (the .deb's declared dependency), so it is the
          # lowest floor reachable without a Tauri webkit downgrade, and it
          # covers 22.04/24.04/25.x, Debian 12+, and RHEL 9 derivatives.
          # When GitHub retires the 22.04 image, replace this with a
          # `container: ubuntu:22.04` on a newer runner rather than bumping it.
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          # Pinned to windows-2022, NOT windows-latest, for the same reason
          # the Linux leg is pinned above: `windows-latest` silently moved to
          # a new image mid-investigation (Visual Studio 18 Enterprise / MSVC
          # 14.51, in place of VS 2022 Build Tools / MSVC 14.44), and that
          # newer toolset hits a C1041 "cannot open program database" during
          # CMake's own internal C-compiler-ABI-detection try_compile for
          # llama-cpp-sys-2's vulkan-shaders-gen sub-project — a step that
          # runs during `cmake -B` (configure), before this job's cargo
          # invocation ever gets a chance to influence build parallelism.
          # windows-2022 keeps the known-good VS 2022 Build Tools toolset
          # this pipeline was built and validated against.
          - os: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      # Windows Defender's real-time scanning transiently locks a freshly
      # written file for AV inspection, which is the classic explanation for
      # an intermittent "cannot open program database" MSVC error on a GH
      # Windows runner — it presented identically to a genuine parallel-write
      # race (same MSVC error text) but persisted even after forcing the
      # build fully serial (CMAKE_BUILD_PARALLEL_LEVEL=1), which a real race
      # could not survive. Exclude the whole checkout before any compiling
      # starts.
      - name: Exclude workspace from Windows Defender (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Key includes matrix.os, not just matrix.platform: pinning the Linux
      # leg to ubuntu-22.04 (see above) while the cache key stayed
      # "release-linux" restored artifacts built on the previously-used
      # ubuntu-latest (24.04, glibc 2.39) — which then failed to even
      # execute on 22.04's glibc 2.35 with "GLIBC_2.39 not found". The OS
      # is part of what makes a cached build valid; it belongs in the key.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.os }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libclang-dev (bindgen), xdg-utils and libfuse2 (linuxdeploy's
          # AppImage bundling) are the same build-only prerequisites
          # `make bootstrap-linux` checks for. They are listed explicitly
          # rather than relied upon because the runner image preinstalling
          # them is an accident of the image, not a guarantee — and now that
          # this job is pinned to a specific image, an image that happens to
          # omit one would fail the build with a confusing downstream error.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev cmake libclang-dev xdg-utils libfuse2

      # Vulkan SDK provides the headers/loader and the glslc shader compiler
      # that ggml's Vulkan backend needs at *build* time. Only the runtime
      # loader needs to be present on the end user's machine (any GPU driver
      # ships it); the SDK itself is a build-only dependency.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/lunarg.gpg > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # humbletim/setup-vulkan-sdk installs the Windows SDK via a raw `7z x`
      # extraction of the installer .exe rather than actually running it —
      # LunarG's Windows installer is a Qt Installer Framework executable, and
      # extracting its payload does not reproduce the real installed layout
      # (Include/, Lib/, Bin/ at the SDK root), so CMake's find_package(Vulkan)
      # fails with "missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR" downstream even
      # though hundreds of MB got extracted somewhere. Run the installer for
      # real, silently, with its documented unattended flags instead.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The per-version download filename LunarG actually serves
          # (vulkansdk-windows-X64-<ver>.exe) doesn't match the naming this
          # originally guessed (VulkanSDK-<ver>-Installer.exe, 404s) — use the
          # "latest" alias URL to fetch the installer (verified working) and
          # only use the version-lookup endpoint to know where it installs to.
          $ver = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt" -UseBasicParsing).Content.Trim()
          $url = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe?u="
          Write-Host "Installing Vulkan SDK $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

          $installDir = "C:\VulkanSDK\$ver"
          if (-not (Test-Path "$installDir\Include\vulkan\vulkan.h")) {
            Write-Error "Vulkan SDK install did not produce the expected layout at $installDir"
            exit 1
          }
          echo "VULKAN_SDK=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$installDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: npm ci

      # llama-cpp-sys-2's vendored ggml-vulkan/CMakeLists.txt nests a second,
      # independent CMake project (ExternalProject_Add(vulkan-shaders-gen))
      # inside the main build. With the default "Visual Studio" generator,
      # that inner project's own compiler-ABI-detection try_compile step
      # (CMakeDetermineCCompiler.cmake, run once per nested configure,
      # unrelated to and unaffected by cargo/cmake's own --parallel/--jobs
      # settings) deterministically fails with "C1041: cannot open program
      # database ... if multiple CL.EXE write to the same .PDB file, please
      # use /FS" — an MSBuild-in-MSBuild wedge other projects vendoring the
      # same ggml CMakeLists.txt have hit identically (e.g.
      # FactusConsulting/whisper-dictate#662). Ninja invokes cl.exe one
      # translation unit at a time with no nested-MSBuild parallel-project
      # layer, so it doesn't have this failure mode — force it for both the
      # outer and (inherited) inner CMake configures. Needs vcvars on PATH
      # first since, unlike the "Visual Studio" generator, Ninja does not
      # locate MSVC itself.
      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Full build with dynamic ggml backends (DYNAMIC_BACKENDS=1): one
      # portable artifact that loads the Vulkan backend at runtime when a GPU
      # driver is present and falls back to CPU when it is not. Vulkan is the
      # single-artifact choice over CUDA — it covers AMD/Intel/NVIDIA and only
      # needs the user's normal graphics driver, not the NVIDIA toolkit.
      # The Windows-only MSVC PDB-race workaround (CL=/FS + MSYS_NO_PATHCONV)
      # lives inside scripts/build_platform.sh, scoped to just the cargo
      # build invocation — setting MSYS_NO_PATHCONV for this entire step
      # broke fetch_bundled_models.sh's own curl download, which relies on
      # the same MSYS path conversion this disables.
      - name: Build
        shell: bash
        env:
          EMAILOPS_GMAIL_CLIENT_ID: ${{ secrets.EMAILOPS_GMAIL_CLIENT_ID }}
          EMAILOPS_GMAIL_CLIENT_SECRET: ${{ secrets.EMAILOPS_GMAIL_CLIENT_SECRET }}
          EMAILOPS_OUTLOOK_CLIENT_ID: ${{ secrets.EMAILOPS_OUTLOOK_CLIENT_ID }}
          DYNAMIC_BACKENDS: "1"
          CARGO_FEATURES: vulkan
        run: make build-${{ matrix.platform }}

      - name: Verify
        shell: bash
        run: make verify-${{ matrix.platform }}

      - name: Stage stable-named artifacts
        shell: bash
        run: make dist-${{ matrix.platform }}

      # Proves the installed binary actually starts and resolves its shared
      # libraries/DLLs on a clean machine — exactly the failure mode a
      # DYNAMIC_BACKENDS packaging regression takes (missing rpath target,
      # missing DLL next to the exe). It does NOT prove GPU offload works:
      # these runners have no GPU, so Vulkan always falls back to CPU here.
      # That still needs an occasional check on real GPU hardware.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # EmailOps touches the OS keychain (Secret Service) at startup, and
          # this runner — like a bare cloud VM — has no D-Bus session bus or
          # logged-in desktop by default. Same fix as private testing: wrap
          # the launch in dbus-run-session + an unlocked throwaway keyring,
          # and give it a virtual display via Xvfb.
          # imagemagick provides `import`, used below to capture what the app
          # actually painted — a process that is merely alive can still be
          # showing a blank window (WebKitGTK's compositing path fails exactly
          # that way on headless boxes), which a liveness check cannot detect.
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring imagemagick
          DEB="$(find release -maxdepth 1 -name '*.deb' | head -1)"
          # apt-get needs an explicit ./ (or absolute path) to treat this as a
          # local file — without it, apt parses "release/EmailOps-linux.deb"
          # as its own package/release-suite syntax (pkgname/suite), taking
          # everything before the LAST slash as a package name to look up,
          # hence "Unable to locate package release".
          sudo apt-get install -y "./$DEB"
          # WEBKIT_DISABLE_COMPOSITING_MODE: there is no usable GL stack on a
          # runner, and without this the webview can come up blank — which
          # would make the screenshot below a white rectangle rather than a
          # useful artifact.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          # -a picks a free display but does not tell us which; a fixed screen
          # size and a known display are needed so `import` can find it.
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --unlock >/dev/null 2>&1
            emailops > /tmp/smoke.log 2>&1 &
            APP_PID=$!
            sleep 8
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERROR: emailops exited within 8s of launch" >&2
              cat /tmp/smoke.log >&2
              exit 1
            fi
            echo "emailops is running (pid $APP_PID) after 8s — smoke test passed"
            # A few extra seconds so the frontend has actually rendered rather
            # than being caught mid-paint.
            sleep 7
            import -window root /tmp/smoke-linux.png || echo "WARN: screenshot capture failed"
            kill "$APP_PID"
          '

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem -Path release -Filter *.msi | Select-Object -First 1).FullName
          if (-not $msi) { Write-Error "no .msi found under release/"; exit 1 }
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /qn" -Wait

          # Don't assume the exact WiX install path — search for it instead,
          # since this is the first time this install has ever been exercised.
          $exe = Get-ChildItem -Path "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter emailops.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "installed emailops.exe not found under Program Files"; exit 1 }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            Write-Error "emailops.exe exited within 8s of launch (missing DLL or startup crash)"
            exit 1
          }
          Write-Host "emailops.exe is running (pid $($proc.Id)) after 8s — smoke test passed"

          # Best-effort screen capture. GitHub's Windows runners execute in a
          # service session, so CopyFromScreen may return a black frame or
          # throw outright depending on whether a desktop is attached. That is
          # a limitation of the runner, not a release defect, so this must
          # never fail the build — the Linux screenshot is the reliable one.
          Start-Sleep -Seconds 7
          try {
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save("$env:RUNNER_TEMP\smoke-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
            Write-Host "screenshot saved to $env:RUNNER_TEMP\smoke-windows.png"
          } catch {
            Write-Host "WARN: screenshot capture unavailable on this runner: $_"
          }
          Stop-Process -Id $proc.Id -Force

      # `always()`: the screenshot is most valuable precisely when the smoke
      # test just failed — a blank window or a visible error dialog explains a
      # startup failure that the process-liveness check can only report as a
      # bare exit code. Uploaded on real releases too, not just dry runs.
      #
      # Single, platform-specific path (not both candidates listed together):
      # actions/upload-artifact@v7 computes a shared root directory across
      # every listed path and rejects one that isn't under the workspace —
      # `runner.temp` on Windows (D:\a\_temp) sits outside the checkout root
      # (D:\a\emailops\emailops), so listing the Linux path
      # (/tmp/smoke-linux.png) alongside it failed with "rootDirectory ... is
      # not a parent directory of the file" even on a job that never produces
      # the other platform's screenshot at all.
      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot-${{ matrix.platform }}
          path: ${{ runner.os == 'Windows' && format('{0}\smoke-windows.png', runner.temp) || '/tmp/smoke-linux.png' }}
          if-no-files-found: ignore
          retention-days: 14

      # Dry-run path: never touch the public releases page. Upload the built
      # installers as a plain workflow artifact instead, so a validation run
      # can still be inspected/downloaded without publishing anything.
      - name: Upload artifacts (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: emailops-${{ matrix.platform }}-dry-run
          path: release/*
          if-no-files-found: error

      # Each of the 3 platform jobs (linux, windows here, windows-cuda below)
      # hits this same tag, so `generate_release_notes: true` would call
      # GitHub's auto-generate API 3 times against an already-existing
      # release; it *appends* to the current body rather than replacing it,
      # producing duplicated "What's Changed"/"New Contributors" blocks (hit
      # in practice on the v0.6.5 release). Extracting the matching
      # CHANGELOG.md section instead is idempotent — every job writes the
      # same text, so re-running never duplicates anything, and it carries
      # real bug-fix prose instead of a bare PR-title list.
      - name: Extract release notes from CHANGELOG
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) { exit }
              if ($0 ~ ("\\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > "${{ runner.temp }}/release-notes.md"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release/*

  # Windows-only, NVIDIA-only additional download alongside the Vulkan build
  # above (which stays the recommended default: it covers AMD/Intel/NVIDIA
  # off the user's normal graphics driver, no NVIDIA toolkit required at
  # build time). This exists for users who specifically want CUDA — measured
  # slower than Vulkan for the same model/quant on the same Tesla T4
  # (7.8-8.2 tok/s vs 33-36 tok/s), so it is offered, not promoted.
  #
  # A completely separate job (not a third matrix leg on `release` above):
  # it needs a different GPU SDK (CUDA Toolkit, not Vulkan SDK) and a
  # differently-named output (`dist_platform.sh windows cuda`), and giving it
  # its own `release/` directory means it can never collide with the Vulkan
  # Windows job's own artifacts even though both jobs upload to the same
  # release tag.
  release-windows-cuda:
    name: Release (windows-cuda)
    runs-on: windows-2022
    # 90 min (matching the Vulkan legs) wasn't enough on the very first run:
    # that measured a Build step still going at 82 min when the job was
    # cancelled, for two reasons neither Vulkan leg hits — (1) a stone-cold
    # Swatinem/rust-cache (first-ever run of this cache key, so every one of
    # the ~800 dependency crates compiled from scratch, not just
    # llama-cpp-sys-2), and (2) standard GitHub-hosted Windows runners have 2
    # cores, not the 4 the timing this workflow is based on (see
    # docs/DECISIONS.md, 2026-08-03 entry) was measured on — parallelism
    # gains from the --jobs 1 fix scale with core count. A cancelled job never
    # reaches its own `Post Run Swatinem/rust-cache` step, so it saves no
    # cache either — this generous limit is mainly to let the first run
    # actually finish and warm the cache; every run after should be far
    # faster (only changed crates rebuild) and this can likely come back down
    # once that's confirmed.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows-cuda

      # Version pinned to what was actually validated end-to-end on a real
      # Tesla T4 (build + install + real GPU offload confirmed via nvidia-smi
      # and an explicit `llamacpp: ... offloading all layers` log line) —
      # not just "whatever's latest". `method: local` (the action's default)
      # downloads and silently runs NVIDIA's own installer, same as the
      # manual install this was validated against; sub-packages filtering is
      # Linux-only in this action, so it isn't set here.
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.0.0"
          method: network

      - run: npm ci

      # See the comment on the equivalent step in the `release` job above —
      # same MSVC-environment requirement (Ninja generator needs vcvars on
      # PATH). The vulkan-shaders-gen PDB-race workaround that job also
      # needs does NOT apply here: GGML_VULKAN is never turned on for a
      # CUDA-only build (confirmed in llama-cpp-sys-2's build.rs), so
      # scripts/build_platform.sh skips forcing --jobs 1 for this feature
      # set — validated at 31m54s for a from-scratch release compile here,
      # vs 270m40s when --jobs 1 was applied unconditionally.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: bash
        env:
          EMAILOPS_GMAIL_CLIENT_ID: ${{ secrets.EMAILOPS_GMAIL_CLIENT_ID }}
          EMAILOPS_GMAIL_CLIENT_SECRET: ${{ secrets.EMAILOPS_GMAIL_CLIENT_SECRET }}
          EMAILOPS_OUTLOOK_CLIENT_ID: ${{ secrets.EMAILOPS_OUTLOOK_CLIENT_ID }}
          DYNAMIC_BACKENDS: "1"
          CARGO_FEATURES: cuda
        run: make build-windows

      - name: Verify
        shell: bash
        run: make verify-windows

      - name: Stage stable-named artifacts
        shell: bash
        run: bash scripts/dist_platform.sh windows cuda

      - name: Smoke test
        shell: pwsh
        run: |
          $msi = (Get-ChildItem -Path release -Filter *cuda*.msi | Select-Object -First 1).FullName
          if (-not $msi) { Write-Error "no cuda .msi found under release/"; exit 1 }
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /qn" -Wait

          $exe = Get-ChildItem -Path "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter emailops.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "installed emailops.exe not found under Program Files"; exit 1 }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            Write-Error "emailops.exe exited within 8s of launch (missing DLL or startup crash)"
            exit 1
          }
          Write-Host "emailops.exe is running (pid $($proc.Id)) after 8s — smoke test passed"

          # No GPU on this runner, so this only proves the CUDA-enabled binary
          # starts and resolves its DLLs (ggml-cuda.dll included) — not that
          # offload actually engages. That still needs an occasional check on
          # real GPU hardware, same caveat as the Vulkan legs above.
          Stop-Process -Id $proc.Id -Force

      - name: Upload artifacts (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: emailops-windows-cuda-dry-run
          path: release/*
          if-no-files-found: error

      # See the matching comment on the linux/windows job's step of the same
      # name — idempotent across all 3 job runs, unlike generate_release_notes.
      - name: Extract release notes from CHANGELOG
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          VERSION="${{ inputs.tag_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) { exit }
              if ($0 ~ ("\\[" ver "\\]")) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > "${{ runner.temp }}/release-notes.md"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release/*
