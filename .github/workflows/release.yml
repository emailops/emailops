name: Release

# Release-on-tag-push is temporarily disabled while we cut releases by
# building locally with `make build-mac` and uploading the .dmg manually
# to the GitHub Release page. Re-enable by uncommenting the `push.tags`
# block below; `workflow_dispatch` is kept on so the workflow can still be
# triggered from the Actions UI when we want CI to build a tag's bundle.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-macos:
    name: Release (macOS universal)
    runs-on: macos-26
    permissions:
      contents: write  # needed to create the GitHub Release

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-universal

      # Import the Developer ID Application certificate into a short-lived
      # keychain that only exists for the duration of this job.
      - name: Import Developer ID Application certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12

          security create-keychain -p "" build.keychain
          security import /tmp/certificate.p12 -k ~/Library/Keychains/build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s ~/Library/Keychains/build.keychain \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security set-keychain-settings ~/Library/Keychains/build.keychain
          # Allow codesign to access the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "" \
            ~/Library/Keychains/build.keychain

          rm /tmp/certificate.p12

      - run: npm ci

      # Tauri reads these env vars automatically to sign and notarize.
      # APPLE_SIGNING_IDENTITY  → passed to codesign
      # APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID → passed to notarytool
      # EMAILOPS_* are the OAuth client credentials build.rs bakes into the binary.
      # Local `make build-mac` picks them up from the gitignored .env.local; a CI
      # build has no such file, so they must come from repository secrets or
      # Gmail/Outlook sign-in is dead on arrival in the published DMG.
      - name: Build, sign, and notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EMAILOPS_GMAIL_CLIENT_ID: ${{ secrets.EMAILOPS_GMAIL_CLIENT_ID }}
          EMAILOPS_GMAIL_CLIENT_SECRET: ${{ secrets.EMAILOPS_GMAIL_CLIENT_SECRET }}
          EMAILOPS_OUTLOOK_CLIENT_ID: ${{ secrets.EMAILOPS_OUTLOOK_CLIENT_ID }}
        run: npm run tauri -- build --target universal-apple-darwin

      - name: Verify signing and notarization
        run: make verify-mac

      # Copy the versioned bundle DMG to a stable, versionless name so the
      # release exposes a permanent "latest" download URL:
      #   .../releases/latest/download/EmailOps-macos.dmg
      - name: Stage stable-named DMG
        run: make dist-mac

      # Delete the ephemeral keychain so the certificate doesn't linger.
      - name: Delete build keychain
        if: always()
        run: security delete-keychain ~/Library/Keychains/build.keychain || true

      # Upload both the stable-named DMG (permanent latest link) and the
      # versioned bundle DMG (kept as a per-release archival artifact).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release/EmailOps-macos.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # Linux (.deb + .AppImage) and Windows (.msi + NSIS .exe). Deliberately a
  # separate job from the macOS one rather than a matrix leg: the macOS path
  # carries certificate import, notarization and keychain teardown that have no
  # analogue here, and folding them together would put that working, signed
  # pipeline at risk for no benefit.
  #
  # NOT code-signed. Linux packages conventionally are not; Windows installers
  # would need an OV/EV certificate the project does not hold, so users see a
  # SmartScreen warning on first run. Adding one means a `signtool` step in
  # scripts/build_platform.sh plus the cert in repository secrets.
  #
  # Asset names match `scripts/dist_platform.sh`, which mirrors `dist-mac`'s
  # convention so every platform has a permanent latest-download URL:
  #   .../releases/latest/download/EmailOps-linux.AppImage
  release-desktop:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev cmake

      # Vulkan SDK provides the headers/loader and the glslc shader compiler
      # that ggml's Vulkan backend needs at *build* time. Only the runtime
      # loader needs to be present on the end user's machine (any GPU driver
      # ships it); the SDK itself is a build-only dependency.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/lunarg.gpg > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@v1.2
        with:
          vulkan-query-version: latest
          vulkan-use-cache: true

      - run: npm ci

      # Full build with dynamic ggml backends (DYNAMIC_BACKENDS=1): one
      # portable artifact that loads the Vulkan backend at runtime when a GPU
      # driver is present and falls back to CPU when it is not. Vulkan is the
      # single-artifact choice over CUDA — it covers AMD/Intel/NVIDIA and only
      # needs the user's normal graphics driver, not the NVIDIA toolkit.
      - name: Build
        shell: bash
        env:
          EMAILOPS_GMAIL_CLIENT_ID: ${{ secrets.EMAILOPS_GMAIL_CLIENT_ID }}
          EMAILOPS_GMAIL_CLIENT_SECRET: ${{ secrets.EMAILOPS_GMAIL_CLIENT_SECRET }}
          EMAILOPS_OUTLOOK_CLIENT_ID: ${{ secrets.EMAILOPS_OUTLOOK_CLIENT_ID }}
          DYNAMIC_BACKENDS: "1"
          CARGO_FEATURES: vulkan
        run: make build-${{ matrix.platform }}

      - name: Verify
        shell: bash
        run: make verify-${{ matrix.platform }}

      - name: Stage stable-named artifacts
        shell: bash
        run: make dist-${{ matrix.platform }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
