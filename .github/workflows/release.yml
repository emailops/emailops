name: Release

# Linux + Windows only. macOS is deliberately NOT built here — it's signed and
# notarized locally via `make build-mac` and uploaded by hand (the `release`
# skill drives that flow end to end), and that's a permanent choice, not a
# stopgap: keeping macOS out of this workflow means the signing/notarization
# secrets never need to touch a job whose only job is producing unsigned
# Linux/Windows installers. `workflow_dispatch` takes an explicit `tag_name`
# so it can be triggered from any ref (e.g. `main` right after pushing a tag)
# and still reliably attach its artifacts to that tag's release — including a
# release the `release` skill already created for the macOS DMG.
#
# Set `dry_run: true` to build/verify/smoke-test without touching the public
# releases page at all — the installers land as a downloadable workflow
# artifact instead. Use this to validate a change to this workflow or the
# build scripts before it's ever tied to a real release tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Ref to build: a release tag (e.g. v0.6.5) for a real release, or any branch/tag when dry_run is checked."
        required: true
        type: string
      dry_run:
        description: "Build, verify, and smoke-test only — never create/update the GitHub Release. Artifacts are uploaded as a workflow artifact instead so they can still be inspected."
        required: false
        type: boolean
        default: false
  # push:
  #   tags:
  #     - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Deliberately one job with a platform matrix, not split per-OS: unlike the
  # macOS build there's no certificate import/notarization/keychain teardown
  # that would need special-casing per leg, so a matrix is the right amount
  # of shared structure.
  #
  # NOT code-signed. Linux packages conventionally are not; Windows installers
  # would need an OV/EV certificate the project does not hold, so users see a
  # SmartScreen warning on first run. Adding one means a `signtool` step in
  # scripts/build_platform.sh plus the cert in repository secrets.
  #
  # Asset names match `scripts/dist_platform.sh`, which mirrors `dist-mac`'s
  # convention so every platform has a permanent latest-download URL:
  #   .../releases/latest/download/EmailOps-linux.AppImage
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev cmake

      # Vulkan SDK provides the headers/loader and the glslc shader compiler
      # that ggml's Vulkan backend needs at *build* time. Only the runtime
      # loader needs to be present on the end user's machine (any GPU driver
      # ships it); the SDK itself is a build-only dependency.
      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/lunarg.gpg > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list "https://packages.lunarg.com/vulkan/lunarg-vulkan-$(lsb_release -cs).list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      # humbletim/setup-vulkan-sdk installs the Windows SDK via a raw `7z x`
      # extraction of the installer .exe rather than actually running it —
      # LunarG's Windows installer is a Qt Installer Framework executable, and
      # extracting its payload does not reproduce the real installed layout
      # (Include/, Lib/, Bin/ at the SDK root), so CMake's find_package(Vulkan)
      # fails with "missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR" downstream even
      # though hundreds of MB got extracted somewhere. Run the installer for
      # real, silently, with its documented unattended flags instead.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt" -UseBasicParsing).Content.Trim()
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Write-Host "Installing Vulkan SDK $ver from $url"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

          $installDir = "C:\VulkanSDK\$ver"
          if (-not (Test-Path "$installDir\Include\vulkan\vulkan.h")) {
            Write-Error "Vulkan SDK install did not produce the expected layout at $installDir"
            exit 1
          }
          echo "VULKAN_SDK=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "$installDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: npm ci

      # Full build with dynamic ggml backends (DYNAMIC_BACKENDS=1): one
      # portable artifact that loads the Vulkan backend at runtime when a GPU
      # driver is present and falls back to CPU when it is not. Vulkan is the
      # single-artifact choice over CUDA — it covers AMD/Intel/NVIDIA and only
      # needs the user's normal graphics driver, not the NVIDIA toolkit.
      - name: Build
        shell: bash
        env:
          EMAILOPS_GMAIL_CLIENT_ID: ${{ secrets.EMAILOPS_GMAIL_CLIENT_ID }}
          EMAILOPS_GMAIL_CLIENT_SECRET: ${{ secrets.EMAILOPS_GMAIL_CLIENT_SECRET }}
          EMAILOPS_OUTLOOK_CLIENT_ID: ${{ secrets.EMAILOPS_OUTLOOK_CLIENT_ID }}
          DYNAMIC_BACKENDS: "1"
          CARGO_FEATURES: vulkan
        run: make build-${{ matrix.platform }}

      - name: Verify
        shell: bash
        run: make verify-${{ matrix.platform }}

      - name: Stage stable-named artifacts
        shell: bash
        run: make dist-${{ matrix.platform }}

      # Proves the installed binary actually starts and resolves its shared
      # libraries/DLLs on a clean machine — exactly the failure mode a
      # DYNAMIC_BACKENDS packaging regression takes (missing rpath target,
      # missing DLL next to the exe). It does NOT prove GPU offload works:
      # these runners have no GPU, so Vulkan always falls back to CPU here.
      # That still needs an occasional check on real GPU hardware.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # EmailOps touches the OS keychain (Secret Service) at startup, and
          # this runner — like a bare cloud VM — has no D-Bus session bus or
          # logged-in desktop by default. Same fix as private testing: wrap
          # the launch in dbus-run-session + an unlocked throwaway keyring,
          # and give it a virtual display via Xvfb.
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring
          DEB="$(find release -maxdepth 1 -name '*.deb' | head -1)"
          # apt-get needs an explicit ./ (or absolute path) to treat this as a
          # local file — without it, apt parses "release/EmailOps-linux.deb"
          # as its own package/release-suite syntax (pkgname/suite), taking
          # everything before the LAST slash as a package name to look up,
          # hence "Unable to locate package release".
          sudo apt-get install -y "./$DEB"
          xvfb-run -a dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --unlock >/dev/null 2>&1
            emailops > /tmp/smoke.log 2>&1 &
            APP_PID=$!
            sleep 8
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERROR: emailops exited within 8s of launch" >&2
              cat /tmp/smoke.log >&2
              exit 1
            fi
            echo "emailops is running (pid $APP_PID) after 8s — smoke test passed"
            kill "$APP_PID"
          '

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem -Path release -Filter *.msi | Select-Object -First 1).FullName
          if (-not $msi) { Write-Error "no .msi found under release/"; exit 1 }
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /qn" -Wait

          # Don't assume the exact WiX install path — search for it instead,
          # since this is the first time this install has ever been exercised.
          $exe = Get-ChildItem -Path "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Recurse -Filter emailops.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error "installed emailops.exe not found under Program Files"; exit 1 }

          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $stillRunning = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $stillRunning) {
            Write-Error "emailops.exe exited within 8s of launch (missing DLL or startup crash)"
            exit 1
          }
          Write-Host "emailops.exe is running (pid $($proc.Id)) after 8s — smoke test passed"
          Stop-Process -Id $proc.Id -Force

      # Dry-run path: never touch the public releases page. Upload the built
      # installers as a plain workflow artifact instead, so a validation run
      # can still be inspected/downloaded without publishing anything.
      - name: Upload artifacts (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: emailops-${{ matrix.platform }}-dry-run
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          generate_release_notes: true
          files: release/*
