# Test-only additions to the dovecot/dovecot image config.

# Submission relays to Mailpit, which keeps what it receives.
submission_relay_host = mailpit
submission_relay_port = 1025
submission_relay_trusted = yes

# Create the role folders, with their SPECIAL-USE attributes, at a user's
# first login: the image's English defaults only name them.
namespace inbox {
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}
