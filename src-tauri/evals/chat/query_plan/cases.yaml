# ── German ───────────────────────────────────────────────────────────────────
# The routing keyword list is English/Spanish only, so German questions never
# had a fast path — the planner is the whole mechanism there. These pin that it
# reads German dates, counts and directions as well as it reads Spanish.
# `today` = Friday 2026-09-18, so "letzte Woche" is 07-09 → 14-09 (end-exclusive).

- id: de_last_week_window
