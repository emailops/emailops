- id: the_first_email_is_a_sort_not_a_window
  question: "cuál es el primer correo que recibí de metrics@emailopslabs.dev"
  today: "2026-09-18"
  expect:
    from: "metrics@emailopslabs.dev"
    order: "oldest"
    limit: 1
  absent: [since, until]
