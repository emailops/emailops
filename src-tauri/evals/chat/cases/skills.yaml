# User skills (`services::skills`): Markdown instructions in
# `<data dir>/skills/<name>/SKILL.md` that a turn follows only when the user
# starts the message with `/name`. Each case installs its own skill for the run
# (`skills:`, see `evals/skill_fixtures.rs`) and removes it afterwards.
#
# WHAT THESE ASSERT
# - `/name` applies the skill, and its body is actually followed: every skill
#   here asks for a marker line (`Ticket template: SUPPORT-REQ`) that nothing
#   else would produce, so an answer that ignores the instructions fails.
# - Without `/name` no skill applies, however well the request matches it.
# - `/a /b request` applies both skills; a bare `/name` still answers; an
#   unknown `/word` is plain text, not an invocation.
# - A `/name` turn stays on the skill when the planner reads the rest as a
#   request to fill one of the app's forms.
#
# Built on the demo mailbox of both demo accounts (Kelvo purifier, Bogotá
# flight, Lisbon stay, infra invoices, Faro Logistics project). Synthetic by
# construction.

- id: skill_needs_slash_en
  question: "my Kelvo air purifier broke, find me their support addresses"
  account: "ulises@fastmail.com"
  category: skills
  tier: smoke
  skills:
    - name: vendor-support
      description: "How to answer when the user needs a vendor's customer support contacts for a broken or faulty product. Use for any request to find support addresses."
      body: |
        1. Search the mail for the vendor's support or customer-care emails.
        2. List every support address you find, one per line, with what that email was about.
        3. End the answer with this exact line: Ticket template: SUPPORT-REQ
  expected_no_skill: true
  expected_answer_not_contains:
    - "SUPPORT-REQ"

- id: skill_invoked_by_slash_es
  question: "/vendor-support mi purificador Kelvo se ha roto"
  account: "ulises@fastmail.com"
  category: skills
  tier: smoke
  skills:
    - name: vendor-support
      description: "How to answer when the user needs a vendor's customer support contacts for a broken or faulty product. Use for any request to find support addresses."
      body: |
        1. Search the mail for the vendor's support or customer-care emails.
        2. List every support address you find, one per line, with what that email was about.
        3. End the answer with this exact line: Ticket template: SUPPORT-REQ
  expected_tools_not_called: ["load_skill"]
  expected_skill: vendor-support
  expected_answer_contains:
    - "support@kelvo-home.example"
    - "SUPPORT-REQ"
  expected_output: "Direcciones de soporte de Kelvo, una por línea: support@kelvo-home.example (aprobó la reclamación del AP-300) y care@kelvo.example.eu (entrega del reemplazo en la UE). Ticket template: SUPPORT-REQ"
  metrics: [answer_relevancy, faithfulness]

- id: skill_needs_slash_es
  question: "se me ha roto el purificador Kelvo, ¿a qué dirección de soporte escribo?"
  account: "ulises@fastmail.com"
  category: skills
  tier: full
  skills:
    - name: vendor-support
      description: "How to answer when the user needs a vendor's customer support contacts for a broken or faulty product. Use for any request to find support addresses."
      body: |
        1. Search the mail for the vendor's support or customer-care emails.
        2. List every support address you find, one per line, with what that email was about.
        3. End the answer with this exact line: Ticket template: SUPPORT-REQ
    - name: travel-brief
      description: "How to brief the user on an upcoming trip: flights, departure times, booking codes and hotel stays. Use when the user asks about a trip, a flight or a stay."
      body: |
        1. Find the booking emails for the trip.
        2. Give date, time and booking code for each flight, and check-in, check-out and price for each stay.
        3. End the answer with this exact line: Brief: TRIP-OK
    - name: invoice-report
      description: "How to report the user's invoices and receipts from vendors for a period. Use when the user asks for invoices, receipts or what they spent."
      body: |
        1. Search the mail for invoices and receipts in the period.
        2. List each vendor on its own line with what the invoice covers.
        3. End the answer with this exact line: Report format: INV-TABLE
  expected_no_skill: true
  expected_answer_not_contains: ["SUPPORT-REQ", "TRIP-OK", "INV-TABLE"]

