- id: skill_invoked_stacked_es
  question: "/client-status /formal-tone Faro Logistics"
  account: "ulises@emailopslabs.dev"
  category: skills
  tier: full
  skills:
    - name: client-status
      description: "How to give a status update on a client project: the latest exchange, open issues and the next step. Use when the user asks how a client or a project is going."
      body: |
        1. Search the mail for the client's latest emails.
        2. Say what happened last, what is still open and what the next step is.
        3. End the answer with this exact line: Status: CLIENT-OK
    - name: formal-tone
      description: "Write the answer in a formal, professional register."
      body: |
        Write in a formal, professional register, with no emoji.
        After everything else, add this exact line: Tone: FORMAL
  expected_tools_not_called: ["load_skill"]
  expected_skill: client-status
  expected_answer_contains: ["CLIENT-OK", "FORMAL"]
  expected_answer_contains_any: ["processing", "webhook", "Sprint 5", "sprint 5"]
  expected_output: "Estado del proyecto con Faro Logistics: se resolvió el incidente de pedidos atascados en 'processing' (timeout del webhook) y Marisol confirmó la solución; queda el siguiente hito tras la demo del Sprint 5. Status: CLIENT-OK. Tone: FORMAL"
  metrics: [answer_relevancy, faithfulness]

