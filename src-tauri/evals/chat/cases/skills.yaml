# The planner would stop this turn at a form: `/name` keeps the skill. The check
# is that the turn stayed on the skill, which a form turn does not record.

- id: skill_survives_a_form_request_en
  question: "/support-tag create a lens for my invoices"
  account: "ulises@fastmail.com"
  category: skills
  skills:
    - name: support-tag
      description: "Tag the reply for the support desk."
      body: |
        1. Answer the request as well as you can.
        2. End the answer with this exact line: Ticket template: SUPPORT-REQ
  expected_skill: support-tag

# Bundled skills (`services::skills::bundled`): the text ships in the binary and
# a case only switches it on (`bundled_skills:`).

- id: bundled_skill_invoked_by_slash_en
  question: "/inbox-triage what should I deal with first?"
  account: "ulises@fastmail.com"
  category: skills
  tier: smoke
  bundled_skills: [inbox-triage]
  expected_skill: inbox-triage
  expected_answer_contains:
    - "Act today"

# "pendiente" fires a direct shortcut, which skips the planner: `/name` still applies.
- id: bundled_skill_applies_on_a_shortcut_phrase_es
  question: "/inbox-triage ¿qué tengo pendiente?"
  account: "ulises@fastmail.com"
  category: skills
  bundled_skills: [inbox-triage]
  expected_skill: inbox-triage

- id: bundled_skill_off_stays_out_en
  question: "/inbox-triage what should I deal with first?"
