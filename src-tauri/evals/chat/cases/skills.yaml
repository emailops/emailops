# ── Picking the right skill among several ────────────────────────────────

- id: skill_picked_by_description_es
  question: "se me ha roto el purificador Kelvo, ¿a qué dirección de soporte escribo?"
  account: "ulises@fastmail.com"
  category: skills
  tier: full
  skills:
    - name: vendor-support
      description: "How to answer when the user needs a vendor's customer support contacts for a broken or faulty product. Use for any request to find support addresses."
      body: |
        1. Search the mail for the vendor's support or customer-care emails.
        2. List every support address you find, one per line, with what that email was about.
        3. End the answer with this exact line: Ticket template: SUPPORT-REQ
    - name: travel-brief
      description: "How to brief the user on an upcoming trip: flights, departure times, booking codes and hotel stays. Use when the user asks about a trip, a flight or a stay."
      body: |
        1. Find the booking emails for the trip.
        2. Give date, time and booking code for each flight, and check-in, check-out and price for each stay.
        3. End the answer with this exact line: Brief: TRIP-OK
    - name: invoice-report
      description: "How to report the user's invoices and receipts from vendors for a period. Use when the user asks for invoices, receipts or what they spent."
      body: |
        1. Search the mail for invoices and receipts in the period.
        2. List each vendor on its own line with what the invoice covers.
        3. End the answer with this exact line: Report format: INV-TABLE
  expected_skill: vendor-support
  expected_answer_contains: ["support@kelvo-home.example", "SUPPORT-REQ"]
  expected_answer_not_contains: ["TRIP-OK", "INV-TABLE"]
  expected_output: "Direcciones de soporte de Kelvo: support@kelvo-home.example (reclamación del AP-300 aprobada) y care@kelvo.example.eu (entrega del reemplazo). Ticket template: SUPPORT-REQ"
  metrics: [answer_relevancy, faithfulness]

