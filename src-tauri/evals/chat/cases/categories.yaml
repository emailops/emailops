# One or more cases per `category` of ../README.md, following ../questions.md.
# Every golden is a complete answer the judge can compare against, phrased the
# way the assistant should answer (same language as the question, concrete
# facts from the demo DB, email:// / draft:// links where the UI expects them).
# Relative dates ("tomorrow", "this week") lean on the run-time anchoring of
# the demo data (calendar re-anchored by ensure_demo_db.sh, `as_of: latest`).

