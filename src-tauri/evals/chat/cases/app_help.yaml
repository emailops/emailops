# Questions about EmailOps itself — answered from the bundled user guides
# (`docs/site/<lang>/*.md`) through the "EmailOps help" lookup in
# `services/help_docs`, not from the mailbox.
#
# WHAT THESE ASSERT
# - The answer cites a guide section: it carries a `help://` link, which is
#   the only way the help block reaches the user (the citation is also what
#   drives the `navigateTo` effect — no link, no navigation).
# - The answer names a fact that lives only in the guide (the Ollama port, the
#   data directory, the VRAM rule), so an answer produced from the mailbox or
#   from the model's own memory fails.
# - No mailbox search ran: a question about the app must not spend a round on
#   `search_emails` and must not end in "I could not find this in your inbox".
# - The mirror case: a mailbox question about a demo sender gets NO help link
#   even though the guides mention chat, drafts and calendars — the similarity
#   gate (`HELP_MIN_SIMILARITY`) keeps the guides out of ordinary turns.
#
# The four languages exercise the language swap: the corpus is indexed in
# en/es/fr/de and a hit on any of them is served in the answer's language.
# The `help://<lang>/…` link therefore follows the AI output language, not the
# language of the question, so the checks pin the scheme rather than the code.
#
# Synthetic by construction: nothing here comes from a real mailbox.

- id: app_help_ollama_en
  question: "how do I make EmailOps use my local Ollama instead of the built-in model?"
  account: "ulises@emailopslabs.dev"
  category: out_of_scope
  tier: smoke
  expected_tools_not_called: ["search_emails"]
  expected_answer_contains: ["help://"]
  expected_answer_contains_any: ["11434", "Ollama (local)", "AI Backend"]
  expected_answer_not_contains: ["could not find this in your inbox", "no puedo encontrar"]
  expected_output: "Open Settings → AI Backend & Models and pick Ollama (local); EmailOps then uses the Ollama server you already run at http://localhost:11434. Make sure the daemon is running and a model is pulled. See AI features › Choosing a backend."
  metrics:
    - answer_relevancy
    - faithfulness

- id: app_help_model_es
  question: "¿cómo cambio el modelo de IA que usa EmailOps?"
  account: "ulises@emailopslabs.dev"
  category: out_of_scope
  tier: smoke
  expected_tools_not_called: ["search_emails"]
  expected_answer_contains: ["help://"]
  expected_answer_contains_any: ["Qwen", "catálogo", "catalog", "AI Backend", "Backend"]
  expected_output: "En Ajustes → AI Backend & Models eliges el backend y el modelo de chat del catálogo integrado (Qwen 3.5 4B es el recomendado). Los modelos demasiado grandes para tu memoria aparecen atenuados. Ver Funciones de IA › El catálogo de modelos."
