    - answer_relevancy
    - faithfulness

- id: app_help_data_location_de
  question: "Wo speichert EmailOps meine Daten auf dem Rechner?"
  account: "ulises@emailopslabs.dev"
  category: out_of_scope
  tier: full
  expected_tools_not_called: ["search_emails"]
  expected_answer_contains: ["help://"]
  expected_answer_contains_any: ["com.emailops.app", "Application Support", "APPDATA", ".local/share", "SQLite"]
  expected_output: "Alles liegt im Anwendungsdatenverzeichnis deines Systems (macOS: ~/Library/Application Support/com.emailops.app, Windows: %APPDATA%\\com.emailops.app, Linux: ~/.local/share/com.emailops.app): eine SQLite-Datenbank und ein models/-Ordner. Zugangsdaten liegen im System-Schlüsselbund. Siehe Datenschutz & Sicherheit › Wo deine Daten gespeichert werden."
  metrics:
    - answer_relevancy
    - faithfulness

- id: app_help_slow_chat_fr
  question: "pourquoi le chat d'EmailOps est-il si lent, et comment l'accélérer ?"
  account: "ulises@emailopslabs.dev"
  category: out_of_scope
  tier: full
  expected_tools_not_called: ["search_emails"]
  expected_answer_contains: ["help://"]
  expected_answer_contains_any: ["VRAM", "plus petit", "smaller model", "contexte", "context window", "Keep model loaded", "modèle chargé", "thinking", "réflexion"]
  expected_output: "Vérifiez d'abord que le modèle tient dans la mémoire (VRAM sur Windows/Linux, mémoire unifiée sur Apple Silicon), sinon prenez un modèle plus petit ; augmentez « Garder le modèle chargé », réduisez la fenêtre de contexte et désactivez le mode réflexion. Voir Dépannage › Le chat est lent."
  metrics:
    - answer_relevancy
    - faithfulness

