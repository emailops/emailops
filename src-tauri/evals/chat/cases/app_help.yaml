# A question about a whole page: every chunk is one section, so the lookup
# served two unrelated sections and the answer said the guide did not list the
# AI features. The page intro now carries the section outline.
- id: app_help_ai_features_overview_es
  question: "que funcionalidades de ia tiene emailops"
  account: "ulises@emailopslabs.dev"
  category: out_of_scope
  tier: smoke
  expected_tools_not_called: ["search_emails"]
  expected_help_pages_any: ["ai-features"]
  expected_no_email_sources: true
  expected_answer_contains: ["help://"]
  # Features only the ai-features outline names — not the installation page.
  expected_answer_contains_any: ["Lentes", "Lenses", "Tablero de etiquetas", "Tag Board"]
  expected_answer_not_contains: ["no detalla", "does not detail", "no incluye", "not included"]
  expected_output: "EmailOps tiene chat con tu buzón, borradores con IA, clasificación, tablero de etiquetas, búsqueda semántica, traducción, tareas, memoria y lentes, todo sobre el backend que elijas. Ver Funciones de IA."
  metrics:
    - answer_relevancy
    - faithfulness

