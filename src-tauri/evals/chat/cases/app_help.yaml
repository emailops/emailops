# Mirror case: a mailbox question must not pull the guides into the answer.
# Marisol Vega is the demo persona's logistics client (synthetic data).
- id: app_help_mailbox_question_stays_mailbox
  question: "what did Marisol say about the production bug?"
  account: "ulises@emailopslabs.dev"
  category: single_fact
  tier: smoke
  expected_answer_not_contains: ["help://"]
  # Grounded in the mailbox: a numbered source citation or an email:// chip.
  # Not pinned to the chip alone — the 4B model drops `email://` on some
  # runs (see user_queries.yaml's note), and that flakiness is not what this
  # case guards.
  expected_answer_contains_any: ["email://", "[1]", "[2]", "[3]"]
  expected_output: "Marisol Vega reported the production bug in the Faro Logistics dashboard thread and asked for a fix timeline; the answer links her email."
  metrics:
    - answer_relevancy
    - faithfulness
