# Research mode: the chat's per-message "Research" toggle.
#
# A normal turn answers from ~8 retrieved sources or one page of 25 search
# rows. Research mode pages the planner's filter (or pulls a wide retrieval
# set when the question names no filter), reads every candidate in batches
# sized to the context window, and writes one report from the findings — see
# `services/chat/research.rs`.
#
# WHAT THESE ASSERT
# Coverage first (`expected_min_research_emails`): a fluent report built from
# three emails is exactly the failure this mode exists to prevent, and it
# would pass any answer-text check. Then that the report is about the subject
# and cites with real `email://` links — the notes cite as `(email://ID)` and a
# small model copies that shape, which the chat would not render as a chip.
#
# Slow by design (minutes per case on a local model), so `full`, never `smoke`.

# The demo mailbox holds 13 weekly stats digests over the last 3 months; a
# normal turn reads a page of them, research must read them all.
- id: research_reads_every_weekly_digest_en
  question: "Research in depth how EmailOps downloads and usage have evolved over the last 3 months, week by week"
  account: "ulises@emailopslabs.dev"
  category: research
  tier: full
  research: true
  expected_min_research_emails: 13
  expected_answer_contains_any: ["download"]
  expected_answer_contains: ["](email://"]
  metrics: []

# No date window or sender: the gather falls to wide retrieval, so this pins
# the retrieval branch of `plan_gather`.
- id: research_topic_question_without_a_filter_en
  question: "Research what users have reported about problems or bugs in EmailOps and summarise the recurring issues"
  account: "ulises@emailopslabs.dev"
  category: research
  tier: full
  research: true
  expected_min_research_emails: 10
  expected_answer_contains: ["](email://"]
  metrics: []

# A list question: the report closes with the complete numbered list of
# matches, built in code (a model-written list stops at its output budget),
# and states the exact count. The demo mailbox's 2025 prospect requests are the
# persona's canonical "list them all" query.
- id: research_lists_every_prospect_request_with_an_exact_count_en
  question: "Give me a list of all the prospect requests I received in 2025, with who asked and what for"
  account: "ulises@emailopslabs.dev"
  category: research
  tier: full
  research: true
  expected_min_research_emails: 3
  expected_answer_contains: ["### Full list (", "](email://"]
  metrics: []
