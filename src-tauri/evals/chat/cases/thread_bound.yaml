# Thread-bound chat: read-only requests must be ANSWERED, not turned into drafts.
#
# Thread-bound turns (the "Chat about this thread" entry point, and the chat
# panel's ambient context chip) expose exactly one tool —
# `generate_email_draft`. A model handed a single tool plus an imperative will
# reach for it: "traduceme este email al español" saved an unrequested reply
# draft and answered "Draft saved: …" instead of translating anything.
#
# `turn.rs::wants_email_draft` now gates the tool on explicit draft/write/reply
# intent, so a translate request gets an empty tool menu and can only answer in
# text. The real assertion here is `expected_tools_not_called` — a positive
# text anchor cannot distinguish "translated the email" from "wrote a draft
# that happens to contain those words".
#
# Thread `thread_30bb61af7512` is the demo DB's "How do I add a new email
# account in EmailOps?" enquiry from a synthetic sender. The generator draws
# thread ids at random, so this id changes every `make demo-db`; re-key it
# from the subject with:
#   sqlite3 .emailops-demo-data/emailops.db \
#     "SELECT DISTINCT thread_id FROM emails WHERE subject LIKE 'How do I add%'"

- id: demo_thread_translate_answers_inline
  question: "traduceme este email al español"
  account: "ulises@emailopslabs.dev"
  thread_id: "thread_30bb61af7512"
  category: thread_bound
  tier: smoke
  expected_tools_not_called: ["generate_email_draft"]
  # Content words from the source email that any faithful Spanish rendering
  # keeps. Deliberately not full phrases — wording varies run to run.
  expected_answer_contains: ["cuenta"]
  # The pre-fix reply was literally "Draft saved: …"; the first partial fix
  # leaked the internal tool name into an apology. Both must stay gone.
  expected_answer_not_contains:
    - "draft saved"
    - "generate_email_draft"
  metrics:
    - answer_relevancy

# The positive counterpart: an explicit draft request must STILL reach the tool.
# Without this, "gate the tool off" could regress into "never offer the tool",
# which would silently break the thread-bound draft feature.
- id: demo_thread_explicit_draft_still_works
  question: "escribe una respuesta a este correo"
  account: "ulises@emailopslabs.dev"
  thread_id: "thread_30bb61af7512"
  category: thread_bound
  tier: smoke
  expected_tools_called: ["generate_email_draft"]
  metrics:
    - answer_relevancy

# The open email is context, not a cage. With a thread in the panel, a
# question about the mailbox at large ("que correos tengo hoy") used to run
# thread-bound — no search tools — and came back "No tengo herramientas
# disponibles para acceder a tu bandeja". `question_leaves_thread` now drops
# the ambient thread for such questions, so the ordinary tool loop answers.
- id: demo_thread_mailbox_question_leaves_thread
  question: "que correos tengo hoy"
  account: "ulises@emailopslabs.dev"
  category: routing
  tier: smoke
  # `ambient_*`, not `thread_id`: the panel hands the OPEN email as ambient
  # context for one turn. A conversation seeded with `thread_id` ("chat about
  # this thread") is an explicit binding and deliberately stays thread-bound.
  ambient_thread_id: "thread_30bb61af7512"
  ambient_account: "ulises@emailopslabs.dev"
  as_of: latest
  expected_tools_called: ["search_emails"]
  expected_tools_not_called: ["generate_email_draft"]
  expected_answer_not_contains:
    - "no tengo herramientas"
    - "no tools"
    - "no puedo acceder"
  metrics:
    - answer_relevancy

# With an email OPEN (ambient context, all tools available) a question about
# that email is answered from it — no draft, no detour through search for
# something already in front of the model.
- id: demo_ambient_summary_answers_from_thread
  question: "resume este correo"
  account: "ulises@emailopslabs.dev"
  category: thread
  tier: smoke
  ambient_thread_id: "thread_30bb61af7512"
  ambient_account: "ulises@emailopslabs.dev"
  expected_tools_not_called: ["generate_email_draft", "search_emails"]
  expected_answer_contains_any: ["cuenta", "account"]
  expected_answer_not_contains:
    - "no tengo herramientas"
    - "no puedo acceder"
  metrics:
    - answer_relevancy

# The old failure that made thread mode tool-less in the first place: a
# translate request must not save a reply draft — now enforced by the draft
# gate even with every tool on the menu.
- id: demo_ambient_translate_never_drafts
  question: "traduceme este email al español"
  account: "ulises@emailopslabs.dev"
  category: thread
  tier: smoke
  ambient_thread_id: "thread_30bb61af7512"
  ambient_account: "ulises@emailopslabs.dev"
  expected_tools_not_called: ["generate_email_draft"]
  expected_answer_not_contains:
    - "](draft://"
    - "no tengo herramientas"
  metrics:
    - answer_relevancy
