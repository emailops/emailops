# Calendar questions must reach the tool loop.
#
# `RagFirst` is strictly sources-only — it exposes no tool definitions at all
# (see `turn.rs`, "RagFirst is strictly sources-only"). So a calendar question
# routed to RAG can only be answered from retrieved email chunks, and
# `list_calendar_events` is unreachable. The model then correctly refuses
# ("no puedo acceder a los resultados de ninguna tool"), which reads to the
# user as the calendar integration being broken.
#
# `TOOLS_FIRST_KEYWORDS` in `services/chat/routing.rs` had no calendar or
# meeting vocabulary in either language, so calendar questions only reached the
# tool loop by accident — when the phrasing happened to carry an unrelated
# keyword ("¿qué tengo hoy?", "reuniones de marzo"). "cuál es la siguiente
# reunión en mi calendario" carries none, and could never work.
#
# `routing.rs`'s unit tests already lock the keyword matching. What these cases
# add is the same decision end to end, through a real turn against a real
# corpus — the layer where a prompt or model change could still send a calendar
# question down the retrieval path.
#
# WHY THESE ASSERT THE ROUTE, NOT THE TOOL CALL
# The synthetic demo DB has no calendars and no events — the generator creates
# emails *about* calendars, not calendar entries. Asserting
# `expected_tools_called: [list_calendar_events]` measured the model's judgement
# on an empty calendar rather than the routing change, and failed even with the
# fix in place. The route is what this change actually controls and is
# deterministic: pre-fix these questions produced `rag_first` (which exposes no
# tool definitions at all, so the calendar tool was unreachable), post-fix they
# produce `tools_first`.
#
# To assert the tool call itself, the demo generator would need to seed calendar
# rows; until then that end of the path is covered by a private case against a
# real mailbox.

- id: calendar_next_meeting_es
  question: "cual es la siguiente reunión en mi calendario?"
  account: "ulises@emailopslabs.dev"
  category: routing
  tier: smoke
  expected_route: tools_first
  # The pre-fix reply explained it could not call the tool and named it inline.
  # A leaked internal tool name in user-facing prose is a recurring failure in
  # this codebase (see thread_bound.yaml, which guards the same shape for
  # `generate_email_draft`), so assert it never surfaces.
  expected_answer_not_contains:
    - "list_calendar_events"
    - "no puedo acceder"
  metrics:
    - answer_relevancy

# English counterpart: the keyword list is bilingual, and a regression that
# only restored one language would otherwise pass.
- id: calendar_next_meeting_en
  question: "what is my next meeting?"
  account: "ulises@emailopslabs.dev"
  category: routing
  tier: smoke
  expected_route: tools_first
  expected_answer_not_contains:
    - "list_calendar_events"
  metrics:
    - answer_relevancy
