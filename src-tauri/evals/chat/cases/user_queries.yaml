# Public synthetic chat eval examples.
# Real mailbox-specific cases belong under ignored `private-evals/chat/cases/`.
#
# Keyed to the bundled demo DB (`make demo-db`) — the Ulises / EmailOps Labs
# consultant persona. The primary account is `ulises@emailopslabs.dev`
# (`demo-acct-work`), whose inbox holds the support/business threads these
# cases query (Marisol Vega's logistics + production-bug threads, Sprint demo
# recaps, the May milestone invoice, etc.).
#
# Note on flakiness with small local models:
# Cases that exercise the `email://EMAIL_ID` link contract sometimes fail
# with Qwen 3.5 4B because the model is non-deterministic at this size —
# it can produce a clean answer with valid links on one run and an empty
# `<think>` or a hallucinated id on the next, on the same input. The
# defense-in-depth allowlist in `MarkdownContent.tsx` validates every
# emitted id and silently drops hallucinations, so the *system* behaves
# correctly even when the *model* doesn't. Treat repeated failures here
# as a model-quality signal (try a larger / different model) rather than
# a regression in the prompt or the email-ref plumbing.

- id: demo_daily_summary
  # Generic "today's emails" summary — exercises the today-shortcut + search
  # path and grounding, independent of any specific sender.
  question: "summarize today's emails"
  account: "ulises@emailopslabs.dev"
  category: period_summary
  tier: smoke
  # `as_of: latest` pins "today" to the newest primary-category email in this
  # account's inbox at run start, so the case is robust against demo-DB age.
  # The demo dataset is generated with rolling 45-day timestamps anchored to
  # wall-clock at generation time; without this, "today" drifts off the
  # fixture the moment the demo DB is older than 24 hours and
  # `search_emails(since=today)` returns zero rows. The resolver scopes the
  # `MAX(timestamp)` query to `DEFAULT_RAG_CATEGORIES` so the pinned date
  # matches what the chat turn can actually retrieve.
  as_of: latest
  expected_route: tools_first
  expected_tools_called: ["search_emails"]
  # Assert a grounded `email://` chip rather than a specific markdown shape.
  # An earlier version required `| Sender |` table headers, but the question
  # doesn't ask for a table, so the 4B model legitimately answers in prose or
  # bullets — and on some runs it translates the reply to Spanish despite the
  # English `ai_output_language`, which would defeat any English header check.
  # The `email://` scheme is language- and format-agnostic and still catches
  # the "couldn't find any emails for today" failure mode (no email → no
  # link). The wrapped id is silently dropped by the UI allowlist if invalid,
  # so a real grounded link is the meaningful signal.
  expected_answer_contains:
    - "email://"
  # The demo pref `chat.default_categories` is primary,updates (same scope the
  # app and the CLI honour), so the day's Updates mail counts too.
  expected_output: "Summary of the most recent day in the inbox: Nadia Brunner asked how to add a second email account (Fastmail IMAP plus a work mailbox) in EmailOps and whether there is a settings page for it; Fly.io reported a successful production deploy of lumen-api; Codeberg opened PR #58 (carrier rate API) on faro-logistics/dashboard. Each item links its email://."
  metrics:
    - answer_relevancy
    - faithfulness

# Exercises the tools-first QUERY PLANNER (services/chat/planner.rs) on a
# first-person SENDER query. No heuristic shortcut matches "emails I sent", so
# the planner runs: one small completion turns the question into
# search_emails(from=<the account's own address>), pre-seeded as round-0, and the
# chat model synthesises from the 5 demo emails Ulises sent. Asserts the route +
# that search_emails was the tool called + a grounded email:// chip. Guards the
# planner's self-reference branch end-to-end (the unit tests cover parsing; this
# proves the wired reply).
- id: demo_planner_self_sent
  question: "show me the latest emails I sent"
  account: "ulises@emailopslabs.dev"
  category: topic_retrieval
  tier: smoke
  expected_route: tools_first
  expected_tools_called: ["search_emails"]
  expected_answer_contains:
    - "email://"
  expected_output: "The latest messages sent by Ulises: “Re: Production bug: orders stuck in 'processing'” to Marisol Vega (9 Sept, fix rolled out), “Re: Mobile nav overlapping the footer” (8 Sept), “Re: Sprint 5 demo recap + next milestone” (8 Sept), “Re: API latency on the /search endpoint” (7 Sept); each with an email:// link."
  metrics:
    - answer_relevancy
    - faithfulness

# A lookup must never end in a saved draft. Observed on the real mailbox with
# Qwen 3.6 35B: "primer correo que envié a X" found the email and the model
# then called generate_email_draft on its own, saving (and pushing) a reply
# nobody asked for. The tool loop now refuses generate_email_draft on a turn
# whose question does not ask to write/reply/draft (`draft_call_allowed`), so
# this holds regardless of what the model attempts. Same demo anchor as
# `demo_planner_oldest` (the oldest sent email is a deterministic hit).
- id: demo_lookup_never_drafts
  question: "muéstrame el primer correo que envié, solo quiero verlo"
  account: "ulises@emailopslabs.dev"
  category: counts_aggregates
  tier: smoke
  expected_route: tools_first
  expected_tools_called: ["search_emails"]
  expected_tools_not_called: ["generate_email_draft"]
  expected_answer_not_contains:
    - "](draft://"
  expected_output: "El primer correo enviado desde la cuenta es «Invoice #2026-014 — May milestone» (5 de septiembre de 2026), mostrado con su enlace email://, sin crear ningún borrador."
  metrics:
    - answer_relevancy
    - faithfulness

# Exercises the planner's ORDER=oldest path — "primer correo / first email".
# Regression for the bug where "first" returned recent mail: search_emails had
# no ascending sort, so the oldest match was structurally unreachable. The
# planner now maps "primer/first/oldest" -> order=oldest, limit=1, and the tool
# threads ascending sort down to the DB. Asserts route + search_emails + a
# grounded email:// chip (the oldest sent email, 2026-06-11 in the demo set).
- id: demo_planner_oldest
  question: "muéstrame el primer correo que envié"
  account: "ulises@emailopslabs.dev"
  category: counts_aggregates
  tier: smoke
  expected_route: tools_first
  expected_tools_called: ["search_emails"]
  expected_answer_contains:
    - "email://"
  expected_output: "El primer correo enviado desde la cuenta es «Invoice #2026-014 — May milestone», del 5 de septiembre de 2026, con su enlace email://."
  metrics:
    - answer_relevancy
    - faithfulness

# Exercises the EMAIL LINKS prompt clause: a sender-anchored query that
# reliably hits multiple demo emails, giving the model the chance to wrap
# mentions as `[label](email://EMAIL_ID)` so the chat UI can render
# open-the-email chips. The expected substring is the scheme prefix
# itself — kept loose so we don't snapshot a specific demo email id.
#
# `show me the latest email from Marisol`:
#  - The `show me the` and `latest` tokens are in `TOOLS_FIRST_KEYWORDS`, so
#    the heuristic classifier in `routing.rs` routes ToolsFirst (in RagFirst
#    the model gets pre-retrieved sources and never calls `search_emails`,
#    failing the `expected_tools_called` check).
#  - The model then calls `search_emails(from="Marisol")`, which matches the
#    4 emails from Marisol Vega in the demo work account (logistics-dashboard
#    inquiry, Sprint 5 demo recap, and the two "Production bug" thread mails),
#    and reports the most recent.
#  - Phrasing note: a multi-result phrasing like "list all emails from
#    Marisol" pushes the 4B model into a markdown table where it tends to
#    botch the link scheme (emitting `[subject] (id)` instead of
#    `[subject](email://id)`). The single-result "latest" phrasing yields a
#    prose answer where the 4B reliably emits a clean inline `email://` chip.
#    The table + link contract is covered separately by
#    `demo_email_links_in_table` (tier full).
- id: demo_email_links_emitted
  question: "show me the latest email from Marisol"
  account: "ulises@emailopslabs.dev"
  category: topic_retrieval
  tier: smoke
  expected_route: tools_first
  expected_tools_called: ["search_emails"]
  expected_answer_contains:
    - "email://"
  expected_output: "The latest email from Marisol Vega is “Re: Production bug: orders stuck in 'processing'” (9 Sept 2026): she confirms the orders are moving again and thanks for the fast turnaround; linked as email://."
  metrics:
    - answer_relevancy
    - faithfulness

# Exercises the DRAFT LINKS clause: ask the chat to draft a reply, expect
# the assistant's confirmation to contain a `draft://` link. Per CLAUDE.md
# scope-to-relevant-cases guidance, run with `--case demo_draft_link_emitted`
# when iterating on draft-link prompt wording. Known flaky on Qwen 3.5 4B
# (see file header note) — the multi-step search → generate_email_draft
# chain hits the model's tool-discipline ceiling and often gives up before
# producing the confirmation that would contain the `draft://` chip. The
# wire is correct; verify manually with a larger model or by interacting
# with the running app.
#
# `production bug`: Marisol Vega's "Production bug: orders stuck in
# 'processing'" thread is a deep demo fixture (the original report + a
# resolved follow-up), so the model has a concrete top result to anchor
# the draft on. "draft" is a TOOLS_FIRST keyword, so the route is forced
# ToolsFirst.
# tier: full — not smoke. The 2-tool chain (search_emails →
# generate_email_draft) sits right at Qwen 3.5 4B's tool-discipline
# ceiling: against the demo dataset the model successfully searches and
# gets the production-bug thread back, but then stalls inside a `<think>`
# block and never emits the second tool call, so the assistant answer
# comes back empty and `](draft://` is missing. Run manually with a
# larger model via `--tier full --model qwen3.5-9b-q4_k_m` (or beyond)
# when iterating on the DRAFT LINKS prompt clause. Keeping the case in
# the file so the regression target is documented; demoting from smoke
# so a `make cli-eval` smoke run stays green by default.
- id: demo_draft_link_emitted
  question: "search for emails about the production bug and draft a brief reply to the top result"
  account: "ulises@emailopslabs.dev"
  category: drafting
  tier: full
  expected_route: tools_first
  expected_tools_called: ["search_emails", "generate_email_draft"]
  expected_answer_contains:
    - "](draft://"
  expected_output: "Finds the production-bug thread from Marisol Vega (orders stuck in 'processing', now fixed) and produces a brief reply draft confirming the fix and offering follow-up, linked as draft://."
  metrics:
    - answer_relevancy
    - faithfulness

# Regression case for the Qwen 3.5 4B failure where a user-requested table
# format caused the model to skip every `email://` link. The strengthened
# EMAIL LINKS clause + Example 3 should make every row carry a link inside
# the Subject cell. Kept short (2 columns, no sort) so the 4B model has
# enough reasoning budget to honour BOTH the table format AND the
# email:// contract — a longer prompt overflows its plan/answer split and
# blocks before the answer ever forms.
#
# `list all emails from Marisol` (table variant): a sender filter that
# reliably returns 4 rows, so the model has multiple rows to render with
# `email://` chips in the Subject cell. The `list all` token forces the
# ToolsFirst route (a bare "search my inbox for X" has no matching keyword
# and falls back to RagFirst, where the tool is never called).
# tier: full — not smoke. Combining the table-format constraint with the
# `email://` chip-in-Subject contract overflows Qwen 3.5 4B's plan/answer
# budget — the model gets the rows but produces no final answer. Keeping
# the case as the canonical regression target for "table + link emission"
# but demoting from smoke so the default tier stays green. Run with
# `--tier full --model qwen3.5-9b-q4_k_m` (or larger) when iterating on
# the EMAIL LINKS prompt clause for table outputs.
- id: demo_email_links_in_table
  question: "list all emails from Marisol and show every result as a markdown table with columns | Sender | Subject |"
  account: "ulises@emailopslabs.dev"
  category: topic_retrieval
  tier: full
  expected_route: tools_first
  expected_tools_called: ["search_emails"]
  expected_answer_contains:
    - "](email://"
  expected_output: "A markdown table with one row per email from Marisol Vega: “Re: Production bug: orders stuck in 'processing'” (9 Sept), “Production bug: orders stuck in 'processing'” (9 Sept), “Sprint 5 demo recap + next milestone” (7 Sept) and “Project inquiry: real-time logistics dashboard” (12 Mar 2025), each subject linked as email://."
  metrics:
    - answer_relevancy
    - faithfulness
