# Graymail: legitimate bulk mail the user does not engage with. Not spam, not an
# attack — just noise. The action is deprioritize-and-collapse, never hide, and
# the budget for getting it wrong is the loosest of the three axes because being
# wrong costs the user a glance rather than a missed invoice.
#
# The distinguishing signal is ENGAGEMENT, not content: the identical newsletter
# is `graymail: clean` in legit.yaml when the user reads and replies to it.
#
# All synthetic. Domains use the RFC 2606 `.example` TLD.

- id: gray-unread-newsletter-no-engagement
  tier: smoke
  raw_headers: |
    From: "Retail Digest" <news@retaildigest.example>
    List-Id: Retail Digest <list.retaildigest.example>
    List-Unsubscribe: <https://retaildigest.example/unsub/k2>
    Authentication-Results: mx.example.com; spf=pass smtp.mailfrom=retaildigest.example;
        dkim=pass header.d=retaildigest.example; dmarc=pass
    Subject: This week in retail
  body: |
    Store openings, closures and the week's numbers.
  sender_engaged: false
  expect:
    graymail: junk
    spam: clean
    phishing: clean
    reasons_include: [list_id_present, list_unsubscribe_present, no_engagement]

