- id: gray-one-click-compliant-esp
  tier: smoke
  raw_headers: |
    From: "Travel Deals" <deals@flyaway.example>
    List-Id: Travel Deals <list.flyaway.example>
    List-Unsubscribe: <https://flyaway.example/unsub/z7>, <mailto:unsub@flyaway.example>
    List-Unsubscribe-Post: List-Unsubscribe=One-Click
    Authentication-Results: mx.example.com; spf=pass smtp.mailfrom=flyaway.example;
        dkim=pass header.d=flyaway.example; dmarc=pass
    Subject: Weekend fares from your airport
  body: |
    Fares refreshed for the coming weekend.
  sender_engaged: false
  expect:
    # Fully compliant, fully authenticated bulk mail. Graymail yes — but the
    # list markers must actively SUPPRESS the spam and phishing axes. Legitimate
    # ESP mail is the single largest source of false positives.
    graymail: junk
    spam: clean
    phishing: clean
    reasons_include: [list_unsubscribe_one_click, list_id_present, no_engagement]

