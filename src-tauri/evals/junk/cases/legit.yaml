- id: legit-server-barely-flagged
  tier: smoke
  raw_headers: |
    From: "Nuria Bastida" <nuria@consultores-red.example>
    Authentication-Results: mx.example.com; spf=softfail smtp.mailfrom=consultores-red.example;
        dkim=pass header.d=consultores-red.example; dmarc=none
    X-Spam-Status: Yes, score=5.4 required=5.0
    X-Spam-Flag: YES
    X-Spam-Report: Spam detection software has identified this incoming email as possible spam.
        Content analysis details: (5.4 points, 5.0 required) pts rule name description
        3.0 SPF_SOFTFAIL SPF: sender does not match SPF record (softfail)
        1.2 MISSING_HEADERS Missing To: header
        1.2 AEAT_SUSPECT_RECEIVED No description available
        -0.1 DKIM_VALID Message has at least one valid DKIM signature
    Subject: Retomamos el contacto
  body: |
    ¡Muy buenas! ¿Qué tal estás? Espero que los proyectos vayan bien.
    Te escribo porque hace tiempo que no hablamos y quería presentarte a alguien.
  expect:
    # REGRESSION, from a real mailbox. The server flagged this at 5.4 against its
    # own threshold of 5.0 — it barely fired, more than half the points came from
    # an SPF softfail (the state forwarded mail and small senders land in), and
    # the message carries a VALID DKIM signature.
    #
    # A flag that marginal is not the same evidence as one at 12.7. The
    # `BarelyCleared` concept already existed for the "No" side; this pins the
    # missing symmetry on the "Yes" side. Without it the detector inherits every
    # borderline call the server ever made.
    spam: clean
    phishing: clean
    graymail: clean

- id: legit-server-barely-flagged-threshold-only-in-report
  tier: smoke
  raw_headers: |
    From: "Tomás Iriarte" <tomas@obra-viva.example>
    Authentication-Results: mx.example.com; spf=softfail smtp.mailfrom=obra-viva.example;
        dkim=pass header.d=obra-viva.example; dmarc=none
    X-Spam-Status: Yes, score=5.6
    X-Spam-Flag: YES
    X-Spam-Report: Content analysis details: (5.6 points, 5.0 required) pts rule name
        3.0 SPF_SOFTFAIL SPF: sender does not match SPF record (softfail)
    Subject: Propuesta de colaboración
  body: |
    Buenos días, adjunto la propuesta que comentamos la semana pasada.
    Quedo atento a tus comentarios.
  expect:
    # Same regression, second half. This server omits `required=` from
    # X-Spam-Status and only reports the threshold inside X-Spam-Report, in a
    # different format ("(5.6 points, 5.0 required)"). Parsing only the first
    # header made every flag from such a server look equally decisive — the fix
    # above changed nothing until this second format was read too.
    spam: clean
    phishing: clean
    graymail: clean

- id: legit-one-off-from-an-esp
  tier: smoke
  raw_headers: |
    From: "Talent Partners" <consultants@talentpartners.example>
    List-Unsubscribe: <https://talentpartners.example/u/aa>
    List-Unsubscribe-Post: List-Unsubscribe=One-Click
    Authentication-Results: mx.example.com; spf=pass smtp.mailfrom=talentpartners.example;
        dkim=pass header.d=talentpartners.example; dmarc=pass
    Subject: Consultant Task — Senior Storage Architect, Copenhagen
  body: |
    <p>A client is looking for a storage architect for a six-month engagement.
    <a href="https://talentpartners.example/roles/8812">Full brief</a> ·
    <a href="https://talentpartners.example/apply/8812">Apply</a> ·
    <a href="https://talentpartners.example/contact">Contact us</a></p>
  sender_engaged: false
  sender_message_count: 1
  expect:
    # REGRESSION, from a real mailbox: four recruiter job offers and a conference
    # invitation were all badged as unwanted bulk.
    #
    # `List-Unsubscribe` marks an ESP, not an unwanted sender — it is mandatory
    # for every bulk sender under the rules Gmail and Yahoo enforce, so it sits
    # on a one-off job offer exactly as it sits on a daily digest. And "you never
    # replied" says nothing about a sender who wrote once: there was no repeated
    # opportunity to answer. Graymail is bulk mail that KEEPS ARRIVING.
    graymail: clean
    spam: clean
    phishing: clean

- id: gray-recurring-sender-with-the-same-markers
  tier: smoke
  raw_headers: |
    From: "Weekly Roundup" <digest@talentpartners.example>
    List-Unsubscribe: <https://talentpartners.example/u/bb>
    List-Unsubscribe-Post: List-Unsubscribe=One-Click
    Authentication-Results: mx.example.com; spf=pass smtp.mailfrom=talentpartners.example;
        dkim=pass header.d=talentpartners.example; dmarc=pass
    Subject: This week's open roles
  body: |
    <p>Twelve new roles this week. <a href="https://talentpartners.example/weekly">Browse</a></p>
  sender_engaged: false
  sender_message_count: 14
  expect:
    # The contrast case. Identical headers and markers to the one above; the only
    # difference is that this sender keeps writing and never gets a reply. That
    # is what graymail actually is, and the pair pins the distinction so a future
    # change cannot collapse them back together.
    graymail: junk
    spam: clean
    phishing: clean
    reasons_include: [list_unsubscribe_present, no_engagement]
