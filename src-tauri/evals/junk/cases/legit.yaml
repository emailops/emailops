# Ground-truth-legitimate mail. This is the hard half of the corpus and the one
# that decides whether the feature is usable: every case here that gets badged
# is a false positive, and the phishing axis has a zero-tolerance budget.
#
# Roughly half of these are ADVERSARIAL-LEGIT — real mail that carries the
# surface features of an attack (link-dense HTML, urgency wording, a Reply-To on
# another domain, a first-contact sender, a money request). A naive detector
# flags them; a good one does not.
#
# Everything is synthetic. Domains use the RFC 2606 `.example` TLD.

- id: legit-invoice-link-heavy-html
  tier: smoke
  raw_headers: |
    From: "Northwind Billing" <billing@northwind.example>
    Reply-To: billing@northwind.example
    Return-Path: <bounces@northwind.example>
    Authentication-Results: mx.example.com; spf=pass smtp.mailfrom=northwind.example;
        dkim=pass header.d=northwind.example; dmarc=pass
    Subject: Invoice NW-2214 is ready
  body: |
    <p>Your invoice is available.</p>
    <p><a href="https://northwind.example/inv/2214">View invoice</a> ·
    <a href="https://northwind.example/pay/2214">Pay now</a> ·
    <a href="https://northwind.example/help">Help</a> ·
    <a href="https://northwind.example/terms">Terms</a></p>
  known_contact_domains: [northwind.example]
  sender_engaged: true
  expect:
    phishing: clean
    spam: clean
    graymail: clean

