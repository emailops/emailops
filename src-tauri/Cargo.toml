[package]
name = "emailops"
version = "0.6.4"
description = "Privacy-first, AI-native email client"
authors = ["Gero DP"]
edition = "2021"
default-run = "emailops"
license = "Apache-2.0"
repository = "https://github.com/emailops/emailops"
homepage = "https://github.com/emailops/emailops"
readme = "../README.md"
keywords = ["email", "tauri", "ai", "gmail", "outlook"]
categories = ["email", "gui"]

[lib]
name = "emailops_lib"
# `staticlib` is only required for iOS/Android Tauri builds; on macOS desktop
# it adds a ~590 MB archive that must be rewritten on every relink. Drop it
# until/unless we ship a mobile target.
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
# Pinned to 0.38 (not 0.40) because `refinery` 0.9.1 caps its rusqlite range
# at <=0.38. Bump together once refinery widens that bound.
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
refinery = { version = "0.9", features = ["rusqlite"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
# Pinned to 0.12 until `oauth2` ships a release whose `AsyncHttpClient`
# impl is wired against reqwest 0.13 (5.0.0 still requires 0.12).
reqwest = { version = "0.12", features = ["json", "stream"] }
# `cli` feature: keyring 4.1 moved `use_native_store` (the OS-store selector our
# keychain init calls) behind this feature; it provides the native-backend glue.
keyring = { version = "4", features = ["cli"] }
keyring-core = "1"
oauth2 = { version = "5", features = ["reqwest"] }
base64 = "0.23"
urlencoding = "2"
url = "2"
open = "5"
dotenvy = "0.15"
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.11"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# Interactive REPL line editor for `emailops-cli` (cli feature only). Optional
# so it never touches default/release desktop builds.
reedline = { version = "0.49", optional = true }
# Secure (no-echo) password prompt for `emailops-cli accounts add imap` (cli
# feature only). Optional so it never touches default/release desktop builds.
rpassword = { version = "7", optional = true }
# Markdown → styled terminal renderer for `emailops-cli` human (pretty) output:
# aligns chat-answer tables, styles headers/bold/lists. cli feature only, so it
# never touches default/release desktop builds. Pulls crossterm 0.29 (already in
# tree via reedline, so the build unifies on one copy).
termimad = { version = "0.35", optional = true }
axum = "0.8"
unicode-normalization = "0.1.25"
regex = "1"
sqlite-vec = "0.1.9"
async-trait = "0.1"
imap = { version = "2", features = ["native-tls"] }
native-tls = "0.2"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls", "builder"] }
mailparse = "0.16"
ammonia = "4"
futures = "0.3"
sys-locale = "0.3"
# ── Cross-platform system access ──────────────────────────────────────────────
# These three replace hand-written `libc` probes that only ever compiled (or
# only ever returned a real answer) on macOS/unix. `libc` itself is gone from
# the dependency list as a result — nothing in the crate needs it any more.
#
# Advisory file locking for the single-instance lock: `flock(2)` on Unix,
# `LockFileEx` on Windows.
fd-lock = "4"
# Physical RAM probe. Default features pull in disk/network/component/user
# collectors we never touch, so only `system` is enabled.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
# Free-space probe (`statvfs` on Unix, `GetDiskFreeSpaceExW` on Windows).
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
# Eval harness deps (used by examples/chat_eval.rs)
serde_yaml = "0.9"
tera = "2"
# Embedded llama.cpp (optional — enabled via the `llamacpp` feature).
# Uses the crates.io release (0.1.151). Cargo vendors the llama.cpp sources
# with the crate, so no submodule/workflow setup is needed.
llama-cpp-2 = { version = "0.1.151", optional = true, default-features = false }
# Raw FFI symbols (llama_log_set / ggml_log_set + GGML_LOG_LEVEL_* constants) so
# we can install a level-filtering log callback. Same version as llama-cpp-2, so
# Cargo unifies it with the copy llama-cpp-2 already pulls in (no second build).
llama-cpp-sys-2 = { version = "0.1.151", optional = true, default-features = false }
# TypeScript type generation (optional — enabled via the `ts` feature)
# cargo test --features ts -- export_bindings → writes src/types/generated/*.ts
ts-rs = { version = "12", optional = true }

# Phoenix (Arize AI) observability (optional — enabled via the `tracing` feature, dev only)
opentelemetry      = { version = "0.32", optional = true }
opentelemetry_sdk  = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }

[features]
# Enables tauri::test::mock_builder for the eval examples so they can build an
# AppHandle outside the desktop runtime. Turn on with:
#   cargo run --features eval --example chat_eval
eval = ["tauri/test"]
# Generate TypeScript types from Rust structs via ts-rs.
# cargo test --features ts export_bindings
ts = ["dep:ts-rs"]

# `emailops-cli` — power-user / agent-driven command line + interactive REPL.
# Compiles `src/cli/` and the `emailops-cli` bin. Pulls in `reedline` for the
# REPL line editor. Gated so it never compiles into default/release desktop
# builds (the bin is `required-features = ["cli"]`). Combine with
# `--no-default-features` to skip the embedded llama.cpp toolchain for the
# read/search commands:
#   cargo run --no-default-features --features cli --bin emailops-cli -- accounts list
cli = ["dep:reedline", "dep:rpassword", "dep:termimad"]

# Embedded llama.cpp inference — enabled by default for production builds.
# Disable with --no-default-features to skip the C++/cmake toolchain for
# fast iteration or CI jobs that only need Ollama/OpenRouter.
default = ["llamacpp"]
llamacpp = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

# Phoenix (Arize AI) observability via OpenTelemetry OTLP.
# Local development only — never enabled in default or release builds.
# Configure PHOENIX_HOST if routing traces to a local collector.
#   cargo tauri dev --features tracing
tracing = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
# GPU backend sub-features — at most one per build.
#
# None of these is enabled by default. `llamacpp` on its own produces a CPU
# build that runs everywhere, which is the right default for a downloadable
# binary: a CUDA-linked build refuses to start without the matching driver.
# `runtime.rs` requests `n_gpu_layers = u32::MAX` unconditionally and llama.cpp
# falls back to CPU when no backend was compiled in, so no code changes with
# these flags — only the linked backend.
#
#   macOS   : metal is selected by llama-cpp-2's own target detection; the flag
#             is here for completeness and need not be passed.
#   Linux   : make build-linux CARGO_FEATURES=cuda   (NVIDIA, needs the CUDA toolkit)
#             make build-linux CARGO_FEATURES=vulkan (AMD/Intel, needs the Vulkan SDK)
#   Windows : make build-windows CARGO_FEATURES=cuda|vulkan, same prerequisites
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[dev-dependencies]
tempfile = "3"
# Used by `sync::mock::MockProviderServer` to replay recorded provider HTTP
# transcripts in integration tests. Not linked into release builds — the
# mock module is gated behind `cfg(any(test, debug_assertions))`.
wiremock = "0.6"

# ─────────────────────────────────────────────────────────────────────────────
# Build profiles — compile-time optimizations for iterative development
# ─────────────────────────────────────────────────────────────────────────────
# `debug = "line-tables-only"` keeps panic backtraces / line numbers but drops
# full DWARF. Cuts `libemailops_lib.{a,rlib}` size ~3-5× and dramatically
# reduces linker work on every relink. Use `debug = true` only when actively
# stepping through code in a debugger.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Compile dependencies at -O1. They're cached after first build, so this
# trades a one-time cost for faster test runs without slowing iterative
# dev compiles of our own code (which stays at default -O0).
[profile.dev.package."*"]
opt-level = 1

[profile.test.package."*"]
opt-level = 1

# ─────────────────────────────────────────────────────────────────────────────
# `emailops-cli` — feature-gated so it never compiles in default/release
# desktop builds (satisfies the "don't add unconditional [[bin]]" guardrail).
# The bin is a ~6-line wrapper over `emailops_lib::cli::run()`.
# ─────────────────────────────────────────────────────────────────────────────
[[bin]]
name = "emailops-cli"
path = "src/cli_main.rs"
required-features = ["cli"]

# ─────────────────────────────────────────────────────────────────────────────
# Eval harnesses and ad-hoc tools — declared as `[[example]]` (not `[[bin]]`)
# so the tauri-bundler does NOT enumerate them and try to copy them into the
# packaged .app. See tauri-apps/tauri#4807. Files live under `examples/`
# (cargo's default examples dir); invoke via:
#   cargo run --features eval --example <name>
# ─────────────────────────────────────────────────────────────────────────────
[[example]]
name = "generate_fixtures"
required-features = ["eval"]

[[example]]
name = "chat_eval"
required-features = ["eval"]

[[example]]
# Single-turn ad-hoc probe of `services::chat::run_chat_turn` against the
# real DB. Usage:
#   cargo run --features eval --example chat_probe -- --question "..."
name = "chat_probe"
required-features = ["eval"]

[[example]]
# Diagnose / repair an email whose attachments were missed at sync time —
# re-fetch the message + re-extract via EmailProvider::get_message.
#   cargo run --release --features eval --example attachment_reextract -- --email-id <id> --repair
name = "attachment_reextract"
required-features = ["eval"]

[[example]]
# Probe the "planner" idea: a tiny prompt → search_emails filter via
# AIProvider::complete (no full chat path). Measures correctness + latency.
#   cargo run --features eval --example query_plan_probe -- "emails I sent"
name = "query_plan_probe"
required-features = ["eval"]

[[example]]
name = "chat_shortcut_eval"
required-features = ["eval"]

[[example]]
name = "task_extract_eval"
required-features = ["eval"]

[[example]]
name = "memory_extract_eval"
required-features = ["eval"]

[[example]]
name = "lens_extract_eval"
required-features = ["eval"]

[[example]]
name = "invoice_extract_eval"
required-features = ["eval"]

[[example]]
name = "email_classification_eval"
required-features = ["eval"]

[[example]]
name = "agent_search_eval"
required-features = ["eval"]

[[example]]
# Junk detector gate — synthetic corpus, no model, no DB. Exits non-zero when
# the false-positive budget is blown.
#   cargo run --features eval --example junk_eval
name = "junk_eval"
required-features = ["eval"]

[[example]]
# Evaluation harness for the AI draft generator. Gated behind `eval` so it is
# never compiled by default. Usage:
#   cargo run --features eval --example draft_eval -- --n 5
name = "draft_eval"
required-features = ["eval"]

[[example]]
# Synthetic language-detection + translation eval (no personal data, no judge).
#   cargo run --features eval --example translation_eval -- [--case <id>]
name = "translation_eval"
required-features = ["eval"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"
